# Official upstream image only; the operator supplies a reviewed sha256 digest.
# Example BOSSMAN_SEARXNG_IMAGE=ghcr.io/searxng/searxng@sha256:<digest>
name: bossman-search
services:
  searxng:
    image: ${BOSSMAN_SEARXNG_IMAGE:?Set an official SearXNG image pinned by sha256}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${BOSSMAN_SEARXNG_SECRET:?Generate a local random secret}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
volumes:
  searxng-cache:
