<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#0f1219"/><text x="70" y="78" fill="#f0f3f8" font-size="38" font-family="sans-serif" font-weight="700">Recovery &amp; Verification</text><text x="70" y="115" fill="#a0aabe" font-size="17">Current authorization and independent post-state proof</text><line x1="145" y1="420" x2="1255" y2="420" stroke="#59657c" stroke-width="6"/><g font-family="sans-serif"><circle cx="160" cy="420" r="55" fill="#54c28e"/><text x="126" y="427" fill="#0f1219" font-size="18" font-weight="700">INTENT</text><text x="88" y="510" fill="#eef1f6" font-size="18">Durable before dispatch</text><circle cx="380" cy="420" r="55" fill="#54c28e"/><text x="327" y="427" fill="#0f1219" font-size="16" font-weight="700">AUTH</text><text x="302" y="510" fill="#eef1f6" font-size="18">Current effect-time grant</text><circle cx="600" cy="420" r="55" fill="#e5b24f"/><text x="565" y="427" fill="#0f1219" font-size="16" font-weight="700">EFFECT</text><text x="518" y="510" fill="#eef1f6" font-size="18">Return is not proof</text><circle cx="820" cy="420" r="55" fill="#54c28e"/><text x="773" y="427" fill="#0f1219" font-size="15" font-weight="700">VERIFY</text><text x="730" y="510" fill="#eef1f6" font-size="18">Independent post-state</text><circle cx="1040" cy="420" r="55" fill="#54c28e"/><text x="990" y="427" fill="#0f1219" font-size="15" font-weight="700">RECOVER</text><text x="942" y="510" fill="#eef1f6" font-size="18">Last verified checkpoint</text><circle cx="1260" cy="420" r="55" fill="#54c28e"/><text x="1215" y="427" fill="#0f1219" font-size="15" font-weight="700">HEALTH</text><text x="1166" y="510" fill="#eef1f6" font-size="18">Fresh re-observation</text></g></svg>