# bossman-shared: the repo-root contracts shared by bossman-core and command-center
# (numeric cache observation contract, learning trace/store, JSON schemas). Installed
# as a real distribution so wheels and containers do not depend on the repository
# checkout (audit P0: "bossman_shared in wheels and Docker").
[project]
license = { text = "AGPL-3.0-only" }
name = "bossman-shared"
version = "0.1.0"
description = "Shared contracts for Bossman: cache observation schema, learning trace store, JSON schemas"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Media tools under tools/ (genjutsu, trend_edit, dataset_check, video gates) and their root tests.
# Headless OpenCV: CI and servers have no GUI; the owner PC uses the same wheels.
media = ["numpy>=1.26", "opencv-python-headless>=4.9", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bossman_shared", "bossman_shared.market_cases", "learning", "bossman_schemas", "nautilus", "nautilus.fixtures"]
include-package-data = true

[tool.setuptools.package-dir]
bossman_schemas = "schemas"

[tool.setuptools.package-data]
bossman_schemas = ["*.json"]
"bossman_shared.market_cases" = ["*.json", "*.jsonl"]
"nautilus.fixtures" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "command-center", "bossman-core"]
