<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(../intro_video/fonts/IBMPlexMono-400.woff2) format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(../intro_video/fonts/IBMPlexMono-500.woff2) format('woff2');}
@font-face{font-family:'Onest';font-weight:500;src:url(../intro_video/fonts/Onest-500.woff2) format('woff2');}
@font-face{font-family:'Onest';font-weight:800;src:url(../intro_video/fonts/Onest-800.woff2) format('woff2');}

</style></head><body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
// BOSSMAN — 32 days + what's next. 22 s deterministic motion piece, synced to the soundtrack from music.py
// (120 BPM; drop 3.0 s; feature hits 6.0/6.75/7.5/8.25/9.0; impact 13.0 s).
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, DUR = 22.0, FPS = 60, SUB = 3;
const BG = '#0a0c10';
const CYAN = [53, 228, 255], BLUE = [58, 91, 255], VIOLET = [180, 76, 255], MINT = [70, 255, 190];
// real per-day commit counts on the product line, 2026-08-27 .. 2026-09-27 (sum 2,469)
const COMMITS = [4,124,114,60,43,22,89,61,38,110,138,120,88,75,17,71,5,2,8,72,19,19,35,82,40,123,182,108,455,71,38,36];
const TOTAL = COMMITS.reduce((a, b) => a + b, 0);
const DAYS = COMMITS.map((_, i) => { const d = new Date(Date.UTC(2026, 7, 27 + i)); return d; });
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const TESTS = 5179;
const HITS = [3.0, 6.0, 6.75, 7.5, 8.25, 9.0, 13.0, 15.0, 17.0, 17.9, 18.8, 19.7, 21.0];

const out = document.getElementById('out'), octx = out.getContext('2d');
const work = document.createElement('canvas'); work.width = W; work.height = H;
const ctx = work.getContext('2d');
const icon = new Image(); icon.src = '../../command-center/ui/icons/icon-1024.png';

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eInExpo = k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toLocaleString('en-US');
const R2 = rng(42), DUST = Array.from({length: 80}, () => ({x: R2() * W, y: R2() * H, s: .6 + R2() * 1.8, sp: 8 + R2() * 26, ph: R2() * 6.28}));
const R3 = rng(9), SPARK = Array.from({length: 140}, () => ({a: R3() * 6.283, v: 300 + R3() * 1300, s: 1.5 + R3() * 3.2, c: [CYAN, BLUE, VIOLET][Math.floor(R3() * 3)], life: .6 + R3() * 1.4}));
const R4 = rng(5), TORDER = Array.from({length: TESTS}, (_, i) => i);
// wave-ish fill order for the test grid: diagonal sweep + jitter
const GCOLS = 104, GROWS = 50;
const TKEY = TORDER.map(i => { const c = i % GCOLS, r = Math.floor(i / GCOLS); return (c * .8 + r * 1.2) / (GCOLS * .8 + GROWS * 1.2) + R4() * .12; });
const beat = t => { const p = ((t - 3.0) / .5) % 1; return t >= 3.0 && t < 11.5 ? Math.exp(-p * 7) : 0; };

function text(s, x, y, font, color, align = 'left', base = 'alphabetic', spacing = 0) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (!spacing) { ctx.fillText(s, x, y); return; }
  let w = 0; for (const ch of s) w += ctx.measureText(ch).width + spacing; w -= spacing;
  let px = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.textAlign = 'left';
  for (const ch of s) { ctx.fillText(ch, px, y); px += ctx.measureText(ch).width + spacing; }
}

// ------------------------------------------------------------------ background
function background(t) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const on = eOutExpo(seg(t, .0, .8)) * (1 - eInExpo(seg(t, 21.3, 21.95)));
  const b = beat(t);
  const hue = t < 6 ? mix(BLUE, BLUE, 0) : t < 10 ? mix(BLUE, VIOLET, seg(t, 6, 10) * .6) : t < 13 ? mix(VIOLET, [20, 150, 140], seg(t, 10, 12) * .5) : BLUE;
  let g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1000 * (1 + .05 * b));
  g.addColorStop(0, rgba(hue.map(v => v * .55), (.5 + .18 * b) * on));
  g.addColorStop(.5, `rgba(40,20,110,${.18 * on})`);
  g.addColorStop(1, 'rgba(10,12,16,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const drift = t * 20;
  for (let y = 0; y < H + 48; y += 48) for (let x = -48; x < W + 48; x += 48) {
    const px = x + (drift % 48), d = Math.hypot(px - CX, y - CY);
    const a = (.07 + .05 * b) * on * (1 - clamp(d / 1150) * .75);
    if (a < .004) continue;
    ctx.fillStyle = `rgba(150,175,255,${a})`; ctx.fillRect(px, y, 2, 2);
  }
  for (const p of DUST) {
    const y = (p.y - t * p.sp + H * 10) % H, x = p.x + Math.sin(t * .8 + p.ph) * 12;
    ctx.fillStyle = `rgba(170,200,255,${.3 * on * (.5 + .5 * Math.sin(t * 2 + p.ph))})`;
    ctx.beginPath(); ctx.arc(x, y, p.s, 0, 7); ctx.fill();
  }
}

// ------------------------------------------------------------------ scene 1: 27 AUG
function scene1(t) {
  if (t > 3.15) return;
  const out1 = 1 - eInExpo(seg(t, 2.75, 3.05));
  // timeline hairline
  const lw = W * .8 * eOutExpo(seg(t, .05, .9));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createLinearGradient(CX - lw / 2, 0, CX + lw / 2, 0);
  lg.addColorStop(0, 'rgba(53,228,255,0)'); lg.addColorStop(.5, `rgba(200,240,255,${.55 * out1})`); lg.addColorStop(1, 'rgba(180,76,255,0)');
  ctx.fillStyle = lg; ctx.fillRect(CX - lw / 2, CY + 150, lw, 2);
  ctx.restore();
  // date: slot-roll digits
  const k = seg(t, .4, 1.25);
  if (k > 0) {
    ctx.save(); ctx.globalAlpha = out1;
    const parts = [['2', '7'], [' '], ['A', 'U', 'G']];
    const glyphs = ['2', '7', ' ', 'A', 'U', 'G'];
    ctx.font = '800 250px Onest'; ctx.textBaseline = 'alphabetic';
    let widths = glyphs.map(g => ctx.measureText(g).width + 8), tw = widths.reduce((a, b) => a + b, 0);
    let x = CX - tw / 2;
    glyphs.forEach((gch, i) => {
      const kk = eOutExpo(seg(t, .4 + i * .06, .95 + i * .06));
      if (kk > 0 && gch !== ' ') {
        ctx.save(); ctx.beginPath(); ctx.rect(x - 10, CY - 250, widths[i] + 20, 300); ctx.clip();
        const yoff = (1 - kk) * 260;
        const grd = ctx.createLinearGradient(0, CY - 200, 0, CY + 20);
        grd.addColorStop(0, '#ffffff'); grd.addColorStop(1, '#b9c6ff');
        ctx.fillStyle = grd; ctx.fillText(gch, x, CY + 20 + yoff);
        // rolling ghost digit above
        ctx.globalAlpha = (1 - kk) * .5 * out1; ctx.fillText(i < 2 ? String((+gch + 3) % 10) : gch, x, CY + 20 + yoff - 280);
        ctx.restore();
      }
      x += widths[i];
    });
    text('2026', CX, CY - 238, '500 34px "IBM Plex Mono"', rgba(CYAN, .85 * eOutExpo(seg(t, .9, 1.3))), 'center', 'alphabetic', 14);
    ctx.restore();
  }
  // first commit terminal line
  const cmd = '$ git commit -m "Bossman Control v0.3"';
  const n = Math.floor(cmd.length * seg(t, 1.8, 2.45));
  if (n > 0) {
    ctx.save(); ctx.globalAlpha = out1;
    text(cmd.slice(0, n), CX - 470, CY + 120, '500 30px "IBM Plex Mono"', '#9FB3DA');
    const hk = eOutBack(seg(t, 2.35, 2.6));
    if (hk > 0) {
      ctx.save(); ctx.translate(CX + 560, CY + 110); ctx.scale(hk, hk);
      ctx.fillStyle = 'rgba(53,228,255,.12)'; ctx.strokeStyle = rgba(CYAN, .9); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(-92, -24, 184, 46, 23); ctx.fill(); ctx.stroke();
      text('1e6c8c56', 0, 1, '500 24px "IBM Plex Mono"', '#DDF7FF', 'center', 'middle');
      ctx.restore();
    }
    // the first node on the timeline
    const nk = eOutBack(seg(t, 2.1, 2.45));
    if (nk > 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const nx = CX - W * .4 + 20, ny = CY + 151;
      const flare = eOutExpo(seg(t, 2.1, 2.9));
      ctx.fillStyle = rgba(CYAN, 1); ctx.shadowColor = rgba(CYAN, 1); ctx.shadowBlur = 40;
      ctx.beginPath(); ctx.arc(nx, ny, 9 * nk, 0, 7); ctx.fill();
      ctx.strokeStyle = rgba(CYAN, .6 * (1 - flare)); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(nx, ny, 9 + 90 * flare, 0, 7); ctx.stroke();
      ctx.restore();
    }
    if (n < cmd.length || Math.floor(t * 5) % 2 === 0) { ctx.font = '500 30px "IBM Plex Mono"'; ctx.fillStyle = rgba(CYAN, 1); ctx.fillRect(CX - 470 + ctx.measureText(cmd.slice(0, n)).width + 6, CY + 96, 14, 30); }
    ctx.restore();
  }
}

// ------------------------------------------------------------------ scene 2: 32 days of commits
function scene2(t) {
  if (t < 2.95 || t > 6.2) return;
  const inK = eOutExpo(seg(t, 2.95, 3.3)), outK = eInExpo(seg(t, 5.7, 6.05));
  const x0 = 170, x1 = W - 170, base = CY + 330, maxH = 430, bw = (x1 - x0) / COMMITS.length;
  const prog = eInOut(seg(t, 3.05, 5.55)) * COMMITS.length;            // how many days revealed
  const b = beat(t);
  ctx.save(); ctx.globalAlpha = inK * (1 - outK);
  // axis
  ctx.fillStyle = 'rgba(160,185,255,.25)'; ctx.fillRect(x0, base + 2, (x1 - x0) * eOutExpo(seg(t, 2.95, 3.4)), 2);
  let shown = 0;
  COMMITS.forEach((c, i) => {
    const k = clamp(prog - i);
    if (k <= 0) return;
    const hk = eOutBack(k) , h = Math.max(4, Math.sqrt(c / 455) * maxH) * hk * (1 - outK * .9);
    shown += c * clamp(k * 1.25);
    const x = x0 + i * bw + 3, w = bw - 6;
    const g = ctx.createLinearGradient(0, base - h, 0, base);
    const top = mix(CYAN, VIOLET, clamp(c / 300));
    g.addColorStop(0, rgba(top, .95)); g.addColorStop(1, rgba(BLUE, .25));
    ctx.fillStyle = g; ctx.shadowColor = rgba(top, .8); ctx.shadowBlur = 18 + 20 * b;
    ctx.beginPath(); ctx.roundRect(x, base - h, w, h, 6); ctx.fill();
    ctx.shadowBlur = 0;
    if (i === 28 && k > .6) {                                            // the 455-commit day (Sep 24)
      const lk = eOutBack(seg(k, .6, 1));
      ctx.save(); ctx.translate(x + w / 2, base - h - 34); ctx.scale(lk, lk);
      text('455 IN ONE DAY', 0, 0, '500 22px "IBM Plex Mono"', '#ffffff', 'center', 'alphabetic', 2);
      ctx.restore();
    }
  });
  // scan head + date
  const head = Math.min(prog, COMMITS.length - .001), di = Math.floor(head);
  if (prog > 0 && prog < COMMITS.length + .5) {
    const hx = x0 + head * bw;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const hg = ctx.createLinearGradient(0, base - maxH - 60, 0, base);
    hg.addColorStop(0, 'rgba(255,255,255,0)'); hg.addColorStop(1, rgba(CYAN, .8));
    ctx.fillStyle = hg; ctx.fillRect(hx - 1, base - maxH - 60, 2, maxH + 60);
    ctx.restore();
    const d = DAYS[di];
    text(`${MON[d.getUTCMonth()]} ${String(d.getUTCDate()).padStart(2, '0')}`, hx, base + 48, '500 24px "IBM Plex Mono"', rgba(CYAN, .95), 'center');
  }
  const hxn = x0 + Math.min(prog, COMMITS.length) * bw;
  const endA = prog >= COMMITS.length - .2 ? 1 : 0;
  if (hxn - x0 > 140) text('AUG 27', x0, base + 48, '400 20px "IBM Plex Mono"', 'rgba(160,185,255,.6)', 'left');
  if (x1 - hxn > 140) text('SEP 27', x1, base + 48, '400 20px "IBM Plex Mono"', 'rgba(160,185,255,.6)', 'right');
  // headline counters
  const dk = eOutExpo(seg(t, 3.05, 3.4));
  const days = Math.max(1, Math.round(clamp(prog / COMMITS.length) * 32));
  ctx.save(); ctx.translate(x0, 285 + (1 - dk) * 40); ctx.globalAlpha *= dk;
  text(String(days).padStart(2, '0'), 0, 0, '800 150px Onest', '#ffffff');
  ctx.font = '800 150px Onest'; const dw = ctx.measureText('32').width;
  text('DAYS', dw + 24, -12, '500 34px "IBM Plex Mono"', rgba(CYAN, .9), 'left', 'alphabetic', 6);
  ctx.restore();
  const ck = eOutExpo(seg(t, 4.15, 4.5));
  if (ck > 0) {
    ctx.save(); ctx.translate(x1, 285 + (1 - ck) * 40); ctx.globalAlpha *= ck;
    const grd = ctx.createLinearGradient(x1 - 600, 0, x1, 0);
    text(fmt(shown), 0, 0, '800 150px Onest', '#ffffff', 'right');
    text('COMMITS', 0, 50, '500 34px "IBM Plex Mono"', rgba(VIOLET, 1), 'right', 'alphabetic', 6);
    ctx.restore();
  }
  ctx.restore();
}

// ------------------------------------------------------------------ scene 3: features
const FEATS = [
  {t: 6.0, name: 'AGENTS', sub: 'plan · act · verify', c: CYAN, ic: 'agents'},
  {t: 6.75, name: 'MEMORY', sub: 'retained experience', c: BLUE, ic: 'memory'},
  {t: 7.5, name: 'COMPUTER USE', sub: 'sees & drives the PC', c: VIOLET, ic: 'cursor'},
  {t: 8.25, name: 'VIDEO STUDIO', sub: 'edit · render · export', c: [255, 110, 200], ic: 'play'},
  {t: 9.0, name: 'JEFF', sub: 'on Telegram', c: MINT, ic: 'plane'},
];
function drawIcon(kind, c, s) {
  ctx.save(); ctx.strokeStyle = rgba(c, 1); ctx.fillStyle = rgba(c, 1); ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = rgba(c, .9); ctx.shadowBlur = 24; ctx.scale(s, s);
  if (kind === 'agents') {
    const P = [[0, -46], [-44, 30], [44, 30]];
    ctx.beginPath(); P.forEach(([x, y], i) => { const [x2, y2] = P[(i + 1) % 3]; ctx.moveTo(x, y); ctx.lineTo(x2, y2); }); ctx.stroke();
    P.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fill(); });
  } else if (kind === 'memory') {
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(0, -30 + i * 30, 52, 16, 0, 0, 7); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-52, -30); ctx.lineTo(-52, 30); ctx.moveTo(52, -30); ctx.lineTo(52, 30); ctx.stroke();
  } else if (kind === 'cursor') {
    ctx.beginPath(); ctx.roundRect(-58, -44, 116, 76, 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-20, 50); ctx.lineTo(20, 50); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -18); ctx.lineTo(4, 26); ctx.lineTo(14, 16); ctx.lineTo(24, 34); ctx.lineTo(30, 30); ctx.lineTo(20, 12); ctx.lineTo(34, 12); ctx.closePath(); ctx.fill();
  } else if (kind === 'play') {
    ctx.beginPath(); ctx.roundRect(-58, -42, 116, 84, 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14, -22); ctx.lineTo(24, 0); ctx.lineTo(-14, 22); ctx.closePath(); ctx.fill();
  } else if (kind === 'plane') {
    ctx.beginPath(); ctx.moveTo(-54, -2); ctx.lineTo(52, -44); ctx.lineTo(30, 46); ctx.lineTo(4, 22); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(52, -44); ctx.lineTo(4, 22); ctx.lineTo(0, 44); ctx.stroke();
  }
  ctx.restore();
}
function scene3(t) {
  if (t < 5.8 || t > 10.25) return;
  const cw = 318, chh = 400, gap = 34, total = FEATS.length * cw + (FEATS.length - 1) * gap;
  const outK = eInExpo(seg(t, 9.8, 10.12));
  FEATS.forEach((f, i) => {
    const k = seg(t, f.t - .06, f.t + .45); if (k <= 0) return;
    const x = CX - total / 2 + i * (cw + gap) + cw / 2, y = CY + 20;
    const pop = eOutBack(k), active = t >= f.t && (i === FEATS.length - 1 || t < FEATS[i + 1].t);
    const flash = Math.exp(-Math.max(0, t - f.t) * 6);
    ctx.save();
    const fly = outK * (i - 2) * 900;
    ctx.translate(x + fly, y + (1 - pop) * 220 - outK * 60); ctx.scale(lerp(1.35, 1, eOutExpo(k)) * (1 + outK * .6), lerp(1.35, 1, eOutExpo(k)) * (1 + outK * .6));
    ctx.globalAlpha = clamp(k * 3) * (1 - outK);
    // glass card
    const g = ctx.createLinearGradient(0, -chh / 2, 0, chh / 2);
    g.addColorStop(0, rgba(f.c, active ? .22 : .10)); g.addColorStop(1, 'rgba(12,14,30,.55)');
    ctx.fillStyle = g; ctx.strokeStyle = rgba(f.c, active ? .95 : .35); ctx.lineWidth = 2;
    ctx.shadowColor = rgba(f.c, .7 * (active ? 1 : .2) + .5 * flash); ctx.shadowBlur = 40 + 60 * flash;
    ctx.beginPath(); ctx.roundRect(-cw / 2, -chh / 2, cw, chh, 28); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
    // top sheen
    const sh = ctx.createLinearGradient(-cw / 2, -chh / 2, cw / 2, 0);
    sh.addColorStop(0, `rgba(255,255,255,${.10 + .25 * flash})`); sh.addColorStop(.5, 'rgba(255,255,255,0)');
    ctx.fillStyle = sh; ctx.beginPath(); ctx.roundRect(-cw / 2, -chh / 2, cw, chh, 28); ctx.fill();
    ctx.save(); ctx.translate(0, -62); drawIcon(f.ic, f.c, 1.25); ctx.restore();
    text(String(i + 1).padStart(2, '0'), -cw / 2 + 24, -chh / 2 + 40, '500 20px "IBM Plex Mono"', rgba(f.c, .8));
    const fs = f.name.length > 10 ? 38 : 46;
    text(f.name, 0, 96, `800 ${fs}px Onest`, '#ffffff', 'center');
    text(f.sub, 0, 140, '400 21px "IBM Plex Mono"', 'rgba(185,200,240,.85)', 'center');
    ctx.restore();
    // impact flash ring
    if (flash > .02) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(f.c, .8 * flash); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(x - cw / 2 - 30 * (1 - flash), y - chh / 2 - 30 * (1 - flash), cw + 60 * (1 - flash), chh + 60 * (1 - flash), 34); ctx.stroke();
      ctx.restore();
    }
  });
  const hk = eOutExpo(seg(t, 5.95, 6.3)) * (1 - outK);
  text('WHAT IT DOES', CX, 190, '500 28px "IBM Plex Mono"', rgba(CYAN, .85 * hk), 'center', 'alphabetic', 10);
}

// ------------------------------------------------------------------ scene 4: tests + your machine
function scene4(t) {
  if (t < 9.95 || t > 12.9) return;
  const inK = eOutExpo(seg(t, 9.95, 10.3));
  const fill = eInOut(seg(t, 10.1, 11.35));
  const morph = eInOut(seg(t, 11.6, 12.15));
  const suck = eInExpo(seg(t, 12.35, 12.85));
  // grid rectangle -> monitor screen
  const gw0 = 1560, gh0 = 750, gw1 = 900, gh1 = 520;
  const gw = lerp(gw0, gw1, morph) * (1 - suck * .97), gh = lerp(gh0, gh1, morph) * (1 - suck * .97);
  const gx = CX - gw / 2, gy = lerp(CY - gh0 / 2 + 70, CY - gh1 / 2 - 20, morph) + suck * (gh1 / 2);
  const cs = gw / GCOLS, rs = gh / GROWS;
  ctx.save(); ctx.globalAlpha = inK;
  for (let i = 0; i < GCOLS * GROWS; i++) {
    const c = i % GCOLS, r = Math.floor(i / GCOLS);
    const pass = i < TESTS && TKEY[i] < fill * 1.13;
    const fresh = pass ? clamp(1 - (fill * 1.13 - TKEY[i]) * 14) : 0;
    ctx.fillStyle = pass ? rgba(mix(MINT, [255, 255, 255], fresh), .55 + .45 * fresh) : 'rgba(120,140,200,.10)';
    ctx.fillRect(gx + c * cs + .6, gy + r * rs + .6, Math.max(cs - 1.4, .5), Math.max(rs - 1.4, .5));
  }
  // monitor bezel appears around the grid
  if (morph > 0 && suck < 1) {
    const a = morph * (1 - suck);
    ctx.strokeStyle = `rgba(200,215,255,${.85 * a})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.roundRect(gx - 26, gy - 26, gw + 52, gh + 52, 22); ctx.stroke();
    ctx.fillStyle = `rgba(200,215,255,${.75 * a})`;
    ctx.fillRect(CX - 16 * (1 - suck), gy + gh + 26, 32 * (1 - suck), 70 * (1 - suck));
    ctx.beginPath(); ctx.roundRect(CX - 150 * (1 - suck), gy + gh + 94 * (1 - suck), 300 * (1 - suck), 12, 6); ctx.fill();
  }
  // counters / captions
  const tk = eOutExpo(seg(t, 10.05, 10.4)) * (1 - morph);
  if (tk > 0) {
    ctx.save(); ctx.globalAlpha = tk;
    text(fmt(TESTS * fill), CX - 16, 148, '800 118px Onest', '#ffffff', 'right');

// ------------------------------------------------------------------ HUD

// ------------------------------------------------------------------ frame
