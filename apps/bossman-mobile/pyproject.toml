[project]
name = "bossman-mobile"
version = "0.1.0"
description = "Bossman Mobile: installable iPhone PWA + loopback gateway to the owner's own Bossman (local models only for chat)."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = ["fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27", "websockets>=12", "python-multipart>=0.0.9"]

[project.optional-dependencies]
icons = ["pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
bossman-mobile = "bossmobile.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bossmobile"]

[tool.setuptools.package-data]
bossmobile = ["ui/*", "ui/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
