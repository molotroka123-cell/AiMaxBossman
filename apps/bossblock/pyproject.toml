[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bossblock"
version = "0.2.0"
description = "BossBlock — Game-Development World Block Capture (OSM, Satellite, Terrain, Street View, 3D Mesh glTF) for Bossman"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  "truststore>=0.9",
]

[project.scripts]
bossblock = "bossblock.__main__:main"
alephgeo = "bossblock.__main__:main"

[tool.setuptools.packages.find]
include = ["bossblock*"]

[tool.setuptools.package-data]
bossblock = ["web/*", "web/icons/*"]
