[project]
name = "poker-vision"
version = "0.1.0"
description = "Poker Train x Vision: pixels -> validated table state -> history -> training/review. Observe/replay for external UIs; acting only in the owner's own trainer."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27"]

[project.optional-dependencies]
live = ["playwright>=1.47"]
window = ["mss>=9.0"]
ocr-comparator = ["rapidocr-onnxruntime>=1.3"]
rules = ["pokerkit>=0.6"]
test = ["pytest>=8"]

[project.scripts]
poker-vision = "pokervision.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pokervision", "pokervision.adapters", "pokervision.vision", "pokervision.eval", "pokervision.control"]

[tool.setuptools.package-data]
"pokervision" = ["data/*.json"]
"pokervision.adapters" = ["profiles/*.json", "profiles/win32/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
