[project]
name = "shorts-factory"
version = "0.1.0"
description = "Bossman Shorts Factory: rights-gated vertical Shorts with owner approval, isolated app."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = ["fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
local-ai = ["faster-whisper>=1.0", "onnxruntime>=1.17", "opencv-python>=4.9"]
youtube = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]
test = ["pytest>=8"]

[project.scripts]
shorts-factory = "shortsfactory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shortsfactory"]

[tool.setuptools.package-data]
shortsfactory = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
