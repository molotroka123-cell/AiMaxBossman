[project]
name = "poker-lora"
version = "0.1.0"
description = "Poker-LoRA data, solver, evaluation and registry for heads-up no-limit hold'em river spots (numpy only; training deps are optional)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
train = ["torch", "transformers", "peft", "accelerate"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pokerlora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
