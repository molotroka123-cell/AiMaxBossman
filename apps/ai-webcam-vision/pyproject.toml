[project]
name = "ai-webcam-vision"
version = "0.2.0"
description = "Operational analytics for a fixed clinic camera (Tapo C200 class), independent of the BOSSMAN control plane"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  # Ships a static ffmpeg binary so the transport boundary can be exercised
  # on machines that do not have ffmpeg installed system-wide.
  "imageio-ffmpeg>=0.5",
  "psutil>=5.9",
]

[project.scripts]
ai-webcam-vision = "ai_webcam_vision.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:ai_webcam_vision.*"]
