[project]
name = "poker-botlab"
version = "0.1.0"
description = "Bossman poker bot training lab: headless NLHE engine + loopback-only adapter for the local Bossman Poker AI trainer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["playwright"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit: evidence/ and tests/ beside botlab/ are not packages (the Windows bundle builds every app wheel).
[tool.setuptools]
packages = ["botlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
