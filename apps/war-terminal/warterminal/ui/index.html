<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bossman · Терминал конфликтов и закупок</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top" role="banner">
  <h1><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h14l-3 4H8v3h7l-3 4H8v5H3z"/></svg><span class="brand">BOSSMAN <span>ТЕРМИНАЛ КОНФЛИКТОВ И ЗАКУПОК</span></span></h1>
  <span id="wm" class="badge wm b-grey" role="status" aria-label="Режим данных">…</span>
  <span id="audit" class="badge b-grey" aria-label="Цепочка аудита">аудит: …</span>
  <span id="fxb" class="badge b-info" aria-label="Дата курсов валют" hidden></span>
  <span id="sancb" class="badge b-info" aria-label="Санкционный список" hidden></span>
  <span class="grow"></span>
  <span id="langsw" class="seg" role="group" aria-label="Язык интерфейса"><button type="button" data-l="ru" lang="ru">RU</button><button type="button" data-l="en" lang="en">EN</button></span>
  <span id="trmode" class="seg" role="group" aria-label="Показ текста: оригинал и перевод"><button type="button" data-m="orig">Оригинал</button><button type="button" data-m="tr">Перевод</button><button type="button" data-m="both">Оба</button></span>
  <span id="utc" class="mut" aria-label="Дата UTC"></span>
  <input id="gsearch" type="search" placeholder="Поиск по тендерам" aria-label="Поиск по тендерам">
  <span id="whoami" class="mut"></span>
  <button id="logout" type="button" hidden>Выйти</button>
</header>
<nav id="nav" aria-label="Разделы"></nav>
<div class="layout">
  <main id="main" tabindex="-1" aria-live="polite"></main>
</div>
<div id="gate" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
