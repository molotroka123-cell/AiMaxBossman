[project]
name = "war-terminal"
version = "0.1.0"
description = "Bossman War & Procurement Terminal: public procurement + conflict context + feasibility, isolated app."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = ["fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27"]

[project.optional-dependencies]
tls = ["truststore>=0.9"]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
war-terminal = "warterminal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["warterminal", "warterminal.connectors"]

[tool.setuptools.package-data]
warterminal = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
