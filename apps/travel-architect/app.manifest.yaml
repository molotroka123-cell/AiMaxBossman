id: travel-architect
name: Travel Architect / Deal Hunter
version: "1.0.0"
kind: workload
contract: "1.0"

description: >
  Browser-assisted travel deal hunter optimizing complete trip cost instead of headline price.

runtime:
  language: python
  python: ">=3.11"
  standalone: true
  imports_bossman: false

default_port: 8913

control_contract:
  transport: http
  http:
    health: "GET /health"
    capabilities: "GET /capabilities"
    metrics: "GET /metrics"
    jobs.create: "POST /api/jobs"
    jobs.list: "GET /api/jobs"
    jobs.status: "GET /api/jobs/{job_id}"
    jobs.cancel: "POST /api/jobs/{job_id}/cancel"
    artifacts.list: "GET /api/jobs/{job_id}/artifacts"

commands:
  - /travel search
  - /travel compare
  - /travel watch
  - /travel itinerary

permissions:
  browser.read: auto
  browser.login: ask
  booking.reserve: ask
  booking.purchase: deny
  payment: deny

ui:
  subtitle: "Browser-assisted travel deal hunter optimizing complete trip cost inst"
  icon: box
  order: 50
  health_path: /health
  metrics_path: /metrics
  actions:
    - id: open
      label: Open
