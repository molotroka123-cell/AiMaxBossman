id: solana-volume-suite
name: Solana AI Volume Suite
version: "1.0.0"
status: quarantined   # MP21-D 2026-10-11: see docs/owner/MP21_D_TRADING_TOKEN_AUDIT_20261011.md
quarantine_reason: "design is volume generation / wallet-graph concealment (wash-trading class); not an earning method"
app_number: 9
kind: workload
contract: "1.0"

description: >-
  Paper-only Solana trading simulation (paper plans only: no transaction, bundle
  or swap-API code since 2026-10-11), order-size and price-impact guards, and a
  Zero-Knowledge KeyVault.
  Volume-faking and wallet-link-obfuscation modes were removed (2026-10-11).

runtime:
  language: python
  python: ">=3.11"
  standalone: true
  imports_bossman: false

default_port: 8501

entrypoints:
  cli: python solana_volume_suite/start_prototype.py
  http: solana_volume_suite.dashboard.safety_app:app
  mainnet_setup: python solana_volume_suite/setup_mainnet.py

control_contract:
  transport: http
  http:
    health: "GET /api/liquidity/status"
    status: "GET /api/status"
    telemetry: "GET /api/telemetry"
    orchestrator.start: "POST /api/orchestrator/start"
    orchestrator.stop: "POST /api/orchestrator/stop"
    vault.generate: "POST /api/vault/generate"
    sweep: "POST /api/sweep"

commands:
  - /volume start
  - /volume stop
  - /volume status
  - /volume sweep
  - /volume mainnet

permissions:
  network.rpc: deny
  network.jito: deny
  wallet.signing: deny
  wallet.export: deny

ui:
  title: "Solana Volume Suite"
  subtitle: "Paper-only trading simulation"
  icon: activity
  order: 45
  health_path: /api/liquidity/status
  metrics_path: /api/status
  actions:
    - id: open
      label: Open Command Center
      url: "http://localhost:8501"
