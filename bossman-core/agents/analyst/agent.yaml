name: analyst
title: Bossman Analyst
model: bossman-smart
cloud_policy: never            # сделки SwapMe и внутренние данные — облако запрещено физически
computer_use: false            # аналитик ограничен файлами и журналом, как указано в prompt.md
tools:
  - fs.read
  - fs.search
  - fs.list
  - search_journal
  - log
limits:
  max_steps: 30
  max_tokens: 200000
  timeout_min: 20
