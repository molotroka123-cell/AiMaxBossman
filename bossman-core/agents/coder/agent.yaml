name: coder
title: Bossman Coder
model: bossman-coder
cloud_policy: ask              # ревью в облаке — только с предпросмотром diff
tools:
  - fs.read
  - fs.write
  - fs.edit
  - fs.search
  - fs.list
  - run
  - tests
  - git
  - search_journal
  - log
  # ЭТАП 8: изолированная песочница. create/run — консеквентные (создают среду и
  # исполняют код), поэтому явно под подтверждением; чтение и снос — без.
  - sandbox.create: confirm
  - sandbox.run: confirm
  - sandbox.status
  - sandbox.collect
  - sandbox.destroy
limits:
  max_steps: 60
  max_tokens: 400000
  timeout_min: 45
