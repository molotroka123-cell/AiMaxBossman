server:
  host: 127.0.0.1
  port: 8765
  allow_unauthenticated_loopback: false
  queue_timeout_seconds: 300
  health_ttl_seconds: 15
  metrics_enabled: true
  request_body_limit_bytes: 8388608

backends:
  ollama:
    base_url: http://127.0.0.1:11434
    health_path: /v1/models
    timeout_seconds: 180
    max_concurrency: 2
  lmstudio:
    base_url: http://127.0.0.1:1234
    health_path: /v1/models
    timeout_seconds: 180
    max_concurrency: 2
    enabled: false
  openrouter:
    base_url: https://openrouter.ai/api
    kind: openrouter
    cloud: true
    api_key_env: OPENROUTER_API_KEY
    health_path: /v1/models
    timeout_seconds: 180
    max_concurrency: 4
    enabled: false
    prompt_cache_enabled: true
    prompt_cache_ttl: 5m  # set 1h for long human-in-loop sessions
    session_affinity_enabled: true

aliases:
  bossman-fast:
    targets:
      - backend: ollama
        model: REPLACE_WITH_FAST_LOCAL_MODEL
        priority: 10
        capabilities: [text]
  bossman-smart:
    targets:
      - backend: ollama
        model: REPLACE_WITH_STRONG_LOCAL_MODEL
        priority: 10
        capabilities: [text, tools]
      - backend: openrouter
        model: REPLACE_WITH_CLOUD_FALLBACK
        priority: 100
        capabilities: [text, tools]
        # Cost Governor (опционально): точная цена ИМЕННО этой модели, USD за
        # МИЛЛИОН токенов (не за токен — единицы легко перепутать). Без обеих
        # цен при включённом бюджете облачная попытка отклоняется fail-closed,
        # а не отправляется «наверное дёшево». Значения не придумывать —
        # только из актуального прайса провайдера.
        # price_usd_per_million_input_tokens: "REPLACE_WITH_REAL_PRICE"
        # price_usd_per_million_output_tokens: "REPLACE_WITH_REAL_PRICE"
        # fixed_request_usd: "0"
  bossman-coder:
    targets:
      - backend: ollama
        model: REPLACE_WITH_CODER_MODEL
        priority: 10
        capabilities: [text, tools, code]
  bossman-opus:
    targets:
      - backend: openrouter
        model: anthropic/claude-opus-5
        priority: 10
        capabilities: [text, tools, code]
        context_window: 1000000
        max_output_tokens: 128000
        # Verified 2026-08-30; re-check OpenRouter pricing before production use.
        price_usd_per_million_input_tokens: "5"
        price_usd_per_million_output_tokens: "25"
        price_usd_per_million_cache_read_tokens: "0.5"
        price_usd_per_million_cache_write_tokens_5m: "6.25"
        price_usd_per_million_cache_write_tokens_1h: "10"
  bossman-vision:
    required_capabilities: [vision]
    targets:
      - backend: ollama
        model: REPLACE_WITH_VISION_MODEL
        priority: 10
        capabilities: [text, vision]
  bossman-embed:
    targets:
      - backend: ollama
        model: REPLACE_WITH_EMBEDDING_MODEL
        priority: 10
        capabilities: [embeddings]

clients:
  bossman-core:
    key_env: BOSSMAN_GATEWAY_CORE_KEY
    requests_per_minute: 600
    burst: 50
    allowed_aliases: ["*"]
  iphone:
    key_env: BOSSMAN_GATEWAY_IPHONE_KEY
    requests_per_minute: 120
    burst: 20
    allowed_aliases: [bossman-fast, bossman-smart, bossman-coder, bossman-vision]
