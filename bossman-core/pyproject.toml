[project]
name = "bossman-core"
version = "0.3.0"
description = "Bossman Control — личные агенты на домашнем сервере (ТЗ v0.3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "playwright>=1.47",
]

[project.optional-dependencies]
# jsonschema: только для тестов (валидация схем apprentice-записей против
# schemas/*.schema.json); runtime-код сознательно не тянет валидатор схем.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.2", "jsonschema>=4.20", "pytest-cov>=5.0"]
# ЭТАП 3: psutil опционален — без него Gateway работает, но отдаёт меньше
# метрик процесса/системной памяти в /metrics.
resource = ["psutil>=5.9"]

[project.scripts]
bossman = "bossman.cli:main"
bossman-gateway = "bossman.gateway.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bossman*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires an explicitly enabled external service/session",
    "restart: destroys and recreates a process or durable store",
    "security: adversarial security boundary coverage",
]
