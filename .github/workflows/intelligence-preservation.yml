name: Intelligence Preservation
env:
  BOSSMAN_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - claude/bossman-control-v03-43igbk
      - sol/intelligence-preservation-on-head
      - claude/bossman-final-audit-closure-aucx9x
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-contract:
    name: anti-dumbness gate contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify fail-closed intelligence gate
        run: python -m pytest -q tests/test_intelligence_preservation_gate.py

  measured-gate:
    name: measured intelligence retention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Fetch owner-attested redacted evidence for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/intelligence_evidence_transport.py fetch
          --repo "$GITHUB_REPOSITORY"
          --expect-sha "$BOSSMAN_ACCEPTANCE_SHA"
          --out "$RUNNER_TEMP/intelligence-preservation-summary.json"
      - name: Evaluate current measured benchmark
        run: >-
          python tools/intelligence_preservation_gate.py
          "$RUNNER_TEMP/intelligence-preservation-summary.json"
          --output intelligence-preservation-report.json
          --core-retention-min 0.98
          --tool-retention-min 1.0
          --min-samples 20
          --expect-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: intelligence-preservation-report
          path: intelligence-preservation-report.json
          if-no-files-found: ignore
