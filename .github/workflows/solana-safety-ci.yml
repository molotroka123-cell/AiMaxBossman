name: Solana safety gates
env:
  BOSSMAN_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
on: [push, pull_request]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest fastapi httpx cryptography solana solders base58
      - run: python -m pytest -q tests/test_solana_safety.py solana_volume_suite/tests/test_safety_vault.py solana_volume_suite/tests/test_control_plane_hardening.py
