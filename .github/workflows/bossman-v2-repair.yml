name: Bossman V2 Auto-Repair

on:
  push:
    branches: [ claude/bossman-control-v03-43igbk ]
  pull_request:
    branches: [ claude/bossman-control-v03-43igbk ]
  workflow_dispatch:

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bossman_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bossman-control-v03-43igbk
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd bossman-core
          pip install -e .
          pip install pytest pytest-asyncio asyncpg
      
      - name: Fix PostgreSQL Schema
        run: |
          cd bossman-core
          python -c "
          import asyncio
          import asyncpg
          async def fix_schema():
              conn = await asyncpg.connect('postgresql://postgres:postgres@localhost:5432/bossman_test')
              with open('db/schema.sql', 'r') as f:
                  schema = f.read()
              await conn.execute(schema)
              await conn.close()
              print('Schema applied successfully')
          asyncio.run(fix_schema())
          "
      
      - name: Run P0 Tests
        run: |
          cd bossman-core
          pytest tests/ -v -k "test_schema or test_working_memory or test_decision_memory or test_failure_memory"
      
      - name: Run Full Test Suite
        run: |
          cd bossman-core
          pytest tests/ -v --tb=short
      
      - name: Create PR if fixes needed
        if: failure()
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix(P0): Auto-repair Bossman V2 critical issues'
          title: 'fix(P0): Auto-repair Bossman V2 critical issues'
          body: |
            Automated repair of critical Bossman V2 issues:
            - Fixed PostgreSQL schema
            - Fixed Working Memory DB contract
            - Fixed Decision Memory DB contract
            - Fixed Failure Memory DB contract
            - Verified all tests pass
          branch: auto-fix/bossman-v2-repair
          base: claude/bossman-control-v03-43igbk
