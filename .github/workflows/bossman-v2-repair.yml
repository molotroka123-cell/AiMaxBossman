name: Bossman V2 Auto-Repair

on:
  # BL-106. Это задание — ОБЯЗАТЕЛЬНОЕ для сертификата выпуска
  # (tools/exact_sha_certify.DEFAULT_REQUIRED), и до этой правки оно слушало
  # ровно одну ветку, заведённую под давно закрытую работу. На канонической
  # линии release/bossman-owner прогонов было РОВНО НОЛЬ — измерено через API,
  # а не вычитано из YAML. Сертификат, которому нужен успешный прогон этого
  # задания на точном SHA, не мог быть выдан никогда, и выглядело это не как
  # отказ, а как отсутствие прогона.
  #
  # Ветки перечислены ШАБЛОНАМИ, а не именами: поимённый список и есть то, из
  # чего эта щель выросла — следующая владельческая ветка выпала бы из него
  # так же молча (тот же механизм, что BL-089). Набор тот же, что у пары
  # Windows и у табло владельца; сверяется
  # tests/test_required_workflows_are_reachable.py против
  # tools/owner_facing_branches.json.
  #
  # `workflow_dispatch` ниже достижимостью не считается: он требует человека, а
  # порядок выпуска, который держится на «не забыть нажать», ничем не
  # отличается от отсутствующей проверки.
  push:
    branches:
      - 'claude/**'
      - 'night/**'
      - 'release/**'
      - 'integrate/bossman-1.7-unified-20260925'
  # pull_request намеренно оставлен КАК БЫЛ, и это замер, а не осторожность.
  # Прогон по событию pull_request несёт в `head_sha` вершину ветки, а не
  # коммит слияния — проверено на настоящем ответе API (прогон 35436272757:
  # head_sha = cf37e603, ровно вершина release/bossman-owner). Значит такой
  # прогон сертификат ЗАСЧИТАЛ БЫ, и второй экземпляр того же задания на тот же
  # SHA не добавляет ни одной улики, а стоит получаса раннера на каждый пуш.
  #
  # Сертификация опирается на push ещё и потому, что путь через pull_request
  # существует лишь пока открыт PR: свойство «задание поднимается» не должно
  # зависеть от того, завёл ли кто-то PR.
  pull_request:
    branches: [ claude/bossman-control-v03-43igbk ]
  workflow_dispatch:

# Своя группа на ref: прогоны соседних веток друг друга не выбивают, а
# `cancel-in-progress: false` не даёт новому пушу убить прогон, по которому
# будет выдаваться сертификат.
concurrency:
  group: bossman-v2-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    
    timeout-minutes: 30
    services:
      postgres:
        # db/schema.sql needs `CREATE EXTENSION vector` — the plain postgres image has no pgvector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bossman_test
        # Без -U проверка запускается от текущего пользователя контейнера (root),
        # а такой роли в базе нет: в логе сервиса «FATAL: role "root" does not exist»
        # каждые 10 секунд, healthcheck никогда не зеленеет, и задание падает по
        # таймауту, ни разу не дойдя до тестов.
        options: >-
          --health-cmd "pg_isready -U postgres -d bossman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
        # CI-AUTOREPAIR-REF-001: no hard-coded ref. On push this checks out the
        # pushed commit; on pull_request it checks out the candidate merge
        # commit — the candidate change is what gets tested, not the base branch.
        # CI-HISTORY-001 (same class): the suite executes historical benchmark
        # commits in isolated worktrees; shallow history cannot resolve them.
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install -e .
          cd bossman-core
          pip install -e ".[dev,resource]"
          pip install asyncpg httpx psutil
      
      - name: Fix PostgreSQL Schema
        run: |
          cd bossman-core
          python -c "
          import asyncio
          import asyncpg
          async def fix_schema():
              conn = await asyncpg.connect('postgresql://postgres:postgres@localhost:5432/bossman_test')
              with open('db/schema.sql', 'r') as f:
                  schema = f.read()
              await conn.execute(schema)
              await conn.close()
              print('Schema applied successfully')
          asyncio.run(fix_schema())
          "
      
      - name: Run P0 Tests
        env:
          BOSSMAN_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/bossman_test
          BOSSMAN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bossman_test
        run: |
          cd bossman-core
          python -m pytest tests/ -q --timeout=120 --timeout-method=signal -k "test_schema or test_working_memory or test_decision_memory or test_failure_memory"

      - name: Run Full Test Suite
        env:
          BOSSMAN_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/bossman_test
          BOSSMAN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bossman_test
        run: |
          cd bossman-core
          # Sandbox process-runtime tests are host-specific (they need the runner to allow
          # the safe runtime's workspace/process model); the Bossman Core CI groups own them.
          python -m pytest tests/ -q --tb=short --timeout=300 --timeout-method=signal \
            --ignore=tests/test_sandbox_safe_runtime.py --ignore=tests/test_stage9_sandbox_e2e.py
      
      - name: Create PR if fixes needed
        # Ограничено ТОЙ ЖЕ веткой, под которую этот шаг писался, и намеренно.
        # Расширение фильтра выше добавляет УЛИКУ (прогон на владельческой
        # ветке), а не автоматического деятеля: правило владельца —
        # «автоматические мониторинги не включать». На release/** этот шаг
        # открывал бы PR в давно закрытую ветку на каждый красный прогон.
        if: failure() && github.ref == 'refs/heads/claude/bossman-control-v03-43igbk'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix(P0): Auto-repair Bossman V2 critical issues'
          title: 'fix(P0): Auto-repair Bossman V2 critical issues'
          body: |
            Automated repair attempt of critical Bossman V2 issues (CI-AUTOREPAIR-REPORT-001).
            The triggering test run FAILED — that is why this PR exists.
            Status of this branch: REPAIR ATTEMPTED, NOT VERIFIED.
            - PostgreSQL schema re-applied
            - Memory DB contracts targeted in the failing run
            CI-AUTOREPAIR-REPORT-001 invariant: no success claims are made here.
            Success can only be established by a fresh green run of the full suite
            on THIS PR's merge commit.
          branch: auto-fix/bossman-v2-repair
          base: claude/bossman-control-v03-43igbk
