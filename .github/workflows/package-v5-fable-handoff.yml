name: Package V5 Fable handoff

on:
  push:
    branches:
      - sol/v5-fable-implementation-pack-20260906
    paths:
      - 'handoffs/v5_fable_source/**'
      - '.github/workflows/package-v5-fable-handoff.yml'

permissions:
  contents: write

concurrency:
  group: package-v5-fable-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reference implementation
        run: |
          python -m pip install pytest
          cd handoffs/v5_fable_source
          PYTHONPATH="$PWD" python -m pytest -q reference_implementation/tests/test_reference_v5.py
      - name: Build deterministic handoff ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          source = Path('handoffs/v5_fable_source')
          target = Path('handoffs/Bossman_V5_Fable_Implementation_Pack_2026-09-06.zip')
          target.unlink(missing_ok=True)
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(source.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(source))
          print('ZIP_SHA256=' + hashlib.sha256(target.read_bytes()).hexdigest())
          print('ZIP_BYTES=' + str(target.stat().st_size))
          PY
      - name: Commit packaged archive to handoff branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f handoffs/Bossman_V5_Fable_Implementation_Pack_2026-09-06.zip
          if git diff --cached --quiet; then
            echo 'Archive unchanged.'
            exit 0
          fi
          git commit -m 'docs(v5): package Fable implementation handoff'
          git push origin HEAD:sol/v5-fable-implementation-pack-20260906
