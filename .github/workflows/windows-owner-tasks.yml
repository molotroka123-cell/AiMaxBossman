name: Windows owner run — light, medium and super-long task
env:
  BOSSMAN_ACCEPTANCE_SHA: ${{ github.sha }}
on:
  # Событие намеренно push, а не pull_request. Разница решает всё: на
  # pull_request фильтр путей считается по СОВОКУПНОМУ диффу ветки, поэтому,
  # стоило драйверу попасть в PR, 25-минутное Windows-задание перезапускалось на
  # каждый следующий коммит — включая чужие. На push тот же фильтр считается по
  # файлам ИМЕННО ЭТОГО пуша, и коммит, не трогающий драйвер, задание не
  # поднимает вовсе.
  #
  # Замер, который это доказал: прогоны 7, 8 и 9 отменены подряд, ни один не
  # дошёл до старта, а пуши в общую ветку шли в 17:05, 17:07, 17:13, 17:16,
  # 17:21, 17:23, 17:23 — автоматический регистратор журнала тестового периода
  # коммитит каждые две-пять минут. При такой частоте не завершилось бы и
  # шестиминутное задание, не то что восемнадцатиминутное.
  push:
    branches:
      - 'claude/**'
      - 'night/**'
      # Ветка сведе́ния воедино. Заведена ПОСЛЕ того, как этот фильтр был
      # написан, и потому выпала из него молча: сорок четыре прогона на
      # release/bossman-owner не содержат ни одного Windows-задания, то есть
      # продукт, который скачивает владелец, из канонической ветки не
      # собирался ни разу (BL-089). Группа concurrency привязана к
      # github.ref, поэтому добавление ветки не отменяет прогоны соседних.
      # Список объявлен в tools/owner_facing_branches.json и сверяется
      # tests/test_windows_workflows_cover_owner_branches.py.
      - 'release/**'
    paths:
      - 'scripts/windows_owner_tasks.py'
      - 'scripts/verify_clean_install.py'
      - '.github/workflows/windows-owner-tasks.yml'
      # Объявление кандидата выпуска поднимает это задание ЯВНО: без него
      # кандидат, не задевший путей выше, прогона не получил бы вовсе, а
      # отсутствующий прогон читается как «замечаний нет» (BL-107).
      - tools/release_candidate.json
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Длительность СЛОЖНОЙ задачи в минутах'
        required: false
        default: '18'
permissions:
  contents: read
concurrency:
  group: windows-owner-tasks-${{ github.ref }}
  # Долгий прогон доводится до конца, пока другие модели продолжают коммитить:
  # оборванный прогон не даёт ни зелёного, ни красного — он не даёт ничего.
  cancel-in-progress: false
jobs:
  owner-run:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Прогон начинается с `git archive HEAD`: продукт ставится из чистого
      # экспорта коммита, а не из рабочего дерева. Windows-раннер по умолчанию
      # разворачивает текст в CRLF — тогда экспорт отличался бы от того, что
      # лежит в коммите, и «установленный продукт» был бы не тем, что мы
      # проверяем. Чекаут идёт байт-в-байт.
      - name: Check out the source byte-for-byte, without line-ending rewriting
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Сам прогон ставит продукт в собственный пустой venv. Здесь ничего
      # предустанавливать не нужно: репозитория на пути импорта быть не должно,
      # иначе проверялся бы чекаут, а не то, что получает владелец.
      - name: Say out loud what this run can and cannot prove
        run: |
          Write-Host "Локальной модели на раннере нет. Всё, что требует LLM, помечается NOT_RUN и НЕ красится в зелёный."
          Write-Host "Проверяется то, что продукт делает сам: команды с подтверждением владельца, правки сайта, переживание жёсткого убийства под нагрузкой."
      - name: Run the owner tasks against the installed product
        env:
          PYTHONUTF8: '1'
        run: >-
          python scripts/windows_owner_tasks.py
          --minutes ${{ github.event.inputs.minutes || '18' }}
          --json-out windows-owner-tasks.json
          --log windows-owner-tasks.log
      - name: Show the verdict lines even when the run failed
        if: always()
        run: |
          if (Test-Path windows-owner-tasks.log) {
            Get-Content windows-owner-tasks.log | Select-String -Pattern 'WINDOWS_OWNER_TASKS|\[FAIL|\[NOT_RUN'
          } else {
            Write-Host "::warning::журнала нет — прогон не дошёл даже до установки"
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-owner-tasks-${{ github.sha }}
          path: |
            windows-owner-tasks.json
            windows-owner-tasks.log
          if-no-files-found: warn
          retention-days: 14
