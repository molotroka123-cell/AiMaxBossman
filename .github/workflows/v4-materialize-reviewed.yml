name: Materialize reviewed V4 source

on:
  push:
    branches: [sol/v4-continuity-hardening-20260906]
    paths:
      - 'handoffs/v4_continuity_patch/**'
      - '.github/workflows/v4-materialize-reviewed.yml'

permissions:
  contents: read

concurrency:
  group: v4-reviewed-publication
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/sol/v4-continuity-hardening-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply exact reviewed patch
        run: python handoffs/v4_continuity_patch/materialize.py --apply
      - name: Commit allowlisted source only; never move another branch
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          m = json.loads(pathlib.Path('handoffs/v4_continuity_patch/manifest.json').read_text())
          subprocess.run(['git', 'add', '--', *sorted(m['after'])], check=True)
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == set(m['after']), actual
          PY
          git config user.name 'Bossman reviewed patch publisher'
          git config user.email 'noreply@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(v4): anchor journals and revalidate current authority at dispatch'
          expected=$(git ls-remote origin refs/heads/sol/v4-continuity-hardening-20260906 | cut -f1)
          test "$expected" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/sol/v4-continuity-hardening-20260906
          mkdir -p v4-results
          git rev-parse HEAD > v4-results/tested-sha.txt
          printf '%s\n' "$GITHUB_SHA" > v4-results/publication-run-sha.txt
      - name: Install declared test dependencies
        run: python -m pip install -e . -e './bossman-core[dev]' -e './command-center[dev]'
      - name: New V4 boundary tests on materialized source
        working-directory: bossman-core
        run: >-
          python -m pytest tests/test_v4_journal_anchor.py tests/test_v4_effect_boundary.py
          tests/test_v4_context_retention.py tests/test_v4_bcc_authorization.py
          tests/test_v4_anchor_bridges.py -q --timeout=60 --junitxml=../v4-results/core.xml
      - name: Existing organization opt-in and default-off
        if: ${{ !cancelled() }}
        working-directory: command-center
        run: >-
          python -m pytest tests/test_v4_organization_anchor.py tests/test_feat_organization.py
          -q --timeout=60 --junitxml=../v4-results/cc.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-publication-${{ github.sha }}
          path: v4-results/
          if-no-files-found: warn
          retention-days: 7
