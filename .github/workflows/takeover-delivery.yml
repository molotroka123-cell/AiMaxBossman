name: Takeover admission verified delivery
on:
  push:
    branches: [fix/takeover-admission-ci-20260906]
    paths: [.github/workflows/takeover-delivery.yml]
permissions:
  contents: read
concurrency:
  group: takeover-admission-delivery
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate pinned concurrent main; only generated registry may conflict
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,os,sys
          root=pathlib.Path.cwd()
          base='927a35373dd44a6309ad9549e421796806057efd'
          verified='4085ae6f0af0cb005c64f8f4b87a5ee7310f4978'
          def git(*args,**kw):return subprocess.run(['git',*args],check=True,**kw)
          git('merge-base','--is-ancestor',verified,'HEAD')
          git('fetch','--no-tags','origin',base)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          result=subprocess.run(['git','merge','--no-commit','--no-ff',base])
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert result.returncode in (0,1)
          assert set(conflicts)<={'docs/testing/SKIPS_REGISTRY.md'},conflicts
          if result.returncode:assert conflicts,'merge failure unrelated to registry'
          registry=root/'docs/testing/SKIPS_REGISTRY.md'
          registry.write_bytes(subprocess.check_output(['git','show',base+':docs/testing/SKIPS_REGISTRY.md']))
          subprocess.run([sys.executable,'tools/skips_registry.py'],check=True)
          manifest=json.loads((root/'handoffs/takeover_2919b_edits.json').read_text())
          def digest(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for item in manifest['files']:
              if item['path']!=str(registry.relative_to(root)):
                  assert digest((root/item['path']).read_bytes())==item['after'],item['path']
          git('add','--','docs/testing/SKIPS_REGISTRY.md')
          git('diff','--check','--cached')
          git('commit','-m','integration: retain concurrent context fix and regenerated registry')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'takeover-results';out.mkdir()
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          allowed={f['path'] for f in manifest['files']}|{'handoffs/takeover_2919b_edits.json','.github/workflows/takeover-delivery.yml'}
          assert set(changed)==allowed,changed
          for item in manifest['files']:
              item['final_blob_sha']=digest((root/item['path']).read_bytes())
          manifest.update(integrated_main_sha=base,tested_sha=sha)
          (out/'tested-sha.txt').write_text(sha+'\n')
          (out/'file-manifest.json').write_text(json.dumps(manifest,indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('PYTHONPATH='+os.pathsep.join(map(str,[root,root/'bossman-core',root/'command-center']))+'\n')
      - name: Install declared packages without owner secrets
        run: python -m pip install -e . -e './bossman-core[dev]' -e './command-center[dev]'
      - name: Core owner control and evidence regressions
        run: >-
          python -m pytest -c bossman-core/pyproject.toml
          bossman-core/tests/test_stage13_auth_redteam.py
          bossman-core/tests/test_computer_operator_owner_control.py
          bossman-core/tests/test_operator_recovery_owner_state.py
          bossman-core/tests/test_stage13_operator_redteam.py
          bossman-core/tests/test_computer_operator_recovery.py
          bossman-core/tests/test_evidence_ledger_hostile.py
          bossman-core/tests/test_learning_evidence_ledger.py
          bossman-core/tests/audit001 -q --timeout=45
          --junitxml=${{ runner.temp }}/takeover-results/core.xml
      - name: Terminal path denial, approvals and finalization
        run: >-
          python -m pytest -c command-center/pyproject.toml
          command-center/tests/test_terminal_context_denial.py
          command-center/tests/test_finalize_unclassified_failure.py
          command-center/tests/test_secrem_s3_sandbox_default_deny.py
          command-center/tests/test_policy_algebra.py
          command-center/tests/test_secrem_f009_terminal.py
          command-center/tests/test_finalize_gate.py
          command-center/tests/test_finalize_capability_match.py
          command-center/tests/test_v21_tool_loop.py
          command-center/tests/test_v21_tools_terminal_browser.py
          -q --timeout=45 --junitxml=${{ runner.temp }}/takeover-results/cc.xml
      - name: Concurrent context regressions, registry, secrets and clean working tree
        run: |
          python -m pytest tests/test_context_bytes_checkpoint.py tests/test_context_slice.py tests/test_skips_registry.py -q --timeout=45 --junitxml=${{ runner.temp }}/takeover-results/root-targeted.xml
          python tools/skips_registry.py --check
          python tools/ci_secret_scan.py
          git diff --exit-code
      - name: Push only the tested isolated branch (never main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/takeover-admission-ci-20260906
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takeover-delivery-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/takeover-results/
          if-no-files-found: warn
          retention-days: 7
