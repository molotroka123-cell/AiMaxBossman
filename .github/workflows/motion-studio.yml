name: motion studio (1.8 candidate)

# Motion Studio's renderers need numpy + Pillow; root-ci installs neither on
# purpose, so tests/test_motion_*.py skip there with a reason and run for real here.
on:
  push:
    branches: ["feat/bossman-1.8-**"]
    paths:
      - 'tools/motion_studio/**'
      - 'tests/test_motion_*.py'
      - '.github/workflows/motion-studio.yml'
  pull_request:
    paths:
      - 'tools/motion_studio/**'
      - 'tests/test_motion_*.py'
      - '.github/workflows/motion-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-tests:
    name: motion studio pytest (numpy + Pillow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install (exact versions)
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m pip install --quiet numpy==2.5.3 pillow==12.3.0 pytest==9.1.1
      - name: Motion Studio tests
        run: python -m pytest -q tests/test_motion_studio.py tests/test_motion_epic.py
