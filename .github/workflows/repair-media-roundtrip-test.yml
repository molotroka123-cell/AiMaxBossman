name: One-shot media roundtrip assertion repair

on:
  push:
    branches:
      - release/bossman-owner

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/bossman-owner
      - name: Update stale Image Studio path assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('command-center/tests/test_media_roundtrip_studio.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_image_storage_roundtrip_produces_a_measured_real_file(tmp_path):
              """Оборот Image Studio через продуктовое хранилище ImageStorage."""
              result = roundtrip.image_roundtrip(tmp_path)
              assert result["status"] == "PASS"
              assert result["stored_through"] == "bcc.v2.images_runtime.ImageStorage"
              assert result["import"]["measured_format"] == "png_pipe"
              assert result["import"]["sha256"] == result["fixture"]["sha256"]
          '''.replace('              ', '    ')
          new = '''def test_image_storage_roundtrip_produces_a_measured_real_file(tmp_path):
              """Оборот Image Studio через настоящий HTTP-контур продукта."""
              result = roundtrip.image_roundtrip(tmp_path)
              assert result["status"] == "PASS"
              assert result["stored_through"] == "bcc.features.images HTTP API"
              transform = result["transform"]
              assert transform["engine"] == "bcc.features.images.transform_asset"
              assert transform["persisted_reopen"] is True
              assert transform["bytes_changed"] is True
              assert result["import"]["measured_format"] == "png_pipe"
              assert result["import"]["sha256"] == result["fixture"]["sha256"]
          '''.replace('              ', '    ')
          count = text.count(old)
          if count == 0:
              print('Target block already updated; nothing to repair.')
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale assertion block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile command-center/tests/test_media_roundtrip_studio.py
      - name: Commit verified test repair
        shell: bash
        run: |
          if git diff --quiet -- command-center/tests/test_media_roundtrip_studio.py; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'bossman-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add command-center/tests/test_media_roundtrip_studio.py
          git commit -m 'test(media): assert real Image Studio HTTP edit path'
          git push origin HEAD:release/bossman-owner
