name: Bossman 1.6 Integration CI

on:
  push:
    branches:
      - integrate/bossman-1.6-owner-20260925
      - integrate/bossman-1.7-unified-20260925
  pull_request:
    branches:
      - release/bossman-owner
    paths:
      - 'bossman-core/**'
      - 'command-center/**'
      - 'tools/**'
      - 'tests/**'
      - 'config/v1.5/**'
      - 'docs/v1.6/**'
      - '.github/workflows/v16-integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v16-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove current 1.5 RC2 and 1.6 lines are both included
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/bossman-1.5-rc2-20260925 feat/bossman-1.6-bossnet-foundation-20260925
          V15=$(git rev-parse origin/release/bossman-1.5-rc2-20260925)
          V16=$(git rev-parse origin/feat/bossman-1.6-bossnet-foundation-20260925)
          git merge-base --is-ancestor "$V15" HEAD || { echo "Missing current 1.5 RC2 $V15"; exit 1; }
          git merge-base --is-ancestor "$V16" HEAD || { echo "Missing current 1.6 $V16"; exit 1; }
          echo "V15_SOURCE=$V15"
          echo "V16_SOURCE=$V16"
          echo "INTEGRATION_SHA=$(git rev-parse HEAD)"

  autonomy-and-foundation:
    needs: lineage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -e ./bossman-core -e ./command-center pytest
      - name: 1.5 autonomy + self-repair + economy
        run: |
          python -m pytest -q \
            bossman-core/tests/test_v15_autonomy_core.py \
            command-center/tests/test_v15_autonomy_feature.py \
            command-center/tests/test_v15_self_repair.py \
            command-center/tests/test_v15_economy_feature.py \
            command-center/tests/test_economy_orchestrator.py \
            command-center/tests/test_owner_input_v15.py \
            tests/test_v15_economy_orchestrator.py \
            tests/test_v15_owner_run.py \
            tests/test_v15_provider_pool.py \
            tests/test_bossman_15_economy_tools.py \
            tests/test_distill_recorder.py
      - name: 1.6 BossNet foundation
        run: |
          python -m pytest -q \
            command-center/tests/test_bossnet_foundation_v16.py \
            command-center/tests/test_coding_limit_saver_v16.py \
            command-center/tests/test_economy_swarm.py \
            command-center/tests/test_game_bootstrap_v16.py
      - name: Scientific self-improvement contracts
        run: |
          python -m pytest -q \
            bossman-core/tests/test_v3_self_improvement.py \
            tests/test_self_improve_lab.py \
            tests/test_self_improve_lab_observers.py \
            tests/test_owner_run_self_improve.py

  vertical-contracts:
    needs: lineage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Bossman + Social Farm test runtimes
        run: |
          python -m pip install --disable-pip-version-check -e ./bossman-core -e ./command-center pytest
          python -m pip install --disable-pip-version-check -e ./apps/social-farm
      - name: YouTube / market learning contracts
        run: |
          python -m pytest -q \
            tests/test_youtube_trader_ingest.py \
            tests/test_youtube_trader_ingest_auto.py \
            tests/test_bossman_15_economy_scripts.py \
            command-center/tests/test_video_learning_primitives.py
      - name: Social Farm reliability contracts
        run: |
          python -m pytest -q \
            apps/social-farm/tests/unit/test_app_entrypoint.py \
            apps/social-farm/tests/unit/test_job_state_machine.py \
            apps/social-farm/tests/unit/test_job_store.py \
            apps/social-farm/tests/unit/test_browser_session.py \
            apps/social-farm/tests/unit/test_browser_states.py \
            apps/social-farm/tests/unit/test_token_lifecycle.py \
            apps/social-farm/tests/unit/test_provider_errors.py
      - name: Game bootstrap contracts
        run: python -m pytest -q command-center/tests/test_game_bootstrap_v16.py
