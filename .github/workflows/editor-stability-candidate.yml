name: Editor stability candidate (no new features)
on:
  push:
    branches: [fix/editor-save-proof-20260906]
permissions:
  contents: read
jobs:
  editor-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize plain patch and verify exact source identity
        shell: bash
        run: |
          test "$(git hash-object command-center/ui/pages/web_designer.js)" = 2402f7e933f152cf131fb47e59a2d455fc5b089a
          git apply --check .delivery/editor-stability.patch
          git apply --index .delivery/editor-stability.patch
          test "$(git hash-object command-center/ui/pages/web_designer.js)" = dcf3fe5dd5df46fded9318aa1e0e3871a206308d
          mkdir -p proof
          git rev-parse HEAD > proof/delivery-sha.txt
          git write-tree > proof/tested-tree.txt
          cp command-center/ui/pages/web_designer.js proof/web_designer.js
      - name: Dependencies
        run: |
          python -m pip install -e . -e './bossman-core[dev]' -e './command-center[dev,browser]'
          python -m playwright install --with-deps chromium
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
      - name: Actual JS save races and existing editor backend regressions
        working-directory: command-center
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_web_designer_save.py tests/test_video_studio_*.py tests/test_video_export_receipt.py tests/test_video_native_finalize_contract.py tests/test_web_designer.py tests/test_web_designer_source_fidelity.py -q --timeout=90 --junitxml=../proof/backend.xml | tee ../proof/backend.log
      - name: Real Chromium editor journeys, source isolation and saved artifacts
        if: ${{ !cancelled() }}
        working-directory: command-center
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_editor_stability_ui.py tests/test_web_designer_sandbox_ui.py -q --timeout=180 --junitxml=../proof/ui.xml | tee ../proof/ui.log
      - name: Hygiene
        run: |
          node --check command-center/ui/pages/web_designer.js
          python tools/ci_secret_scan.py
          git diff --cached --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-proof-${{ github.sha }}
          path: proof/
          retention-days: 7
  store-validated-source:
    needs: editor-proof
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Store verified immutable source blob; no branch update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          subprocess.run(['git','apply','--check','.delivery/editor-stability.patch'],check=True)
          subprocess.run(['git','apply','.delivery/editor-stability.patch'],check=True)
          data=pathlib.Path('command-center/ui/pages/web_designer.js').read_bytes()
          digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert digest=='dcf3fe5dd5df46fded9318aa1e0e3871a206308d'
          assert os.environ['GITHUB_REPOSITORY']=='molotroka123-cell/AiMaxBossman'
          req=urllib.request.Request('https://api.github.com/repos/molotroka123-cell/AiMaxBossman/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as response: stored=json.load(response)
          assert stored['sha']==digest
          print('VALIDATED_WEB_BLOB='+digest)
