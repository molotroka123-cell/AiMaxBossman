name: PostgreSQL run contracts

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-contracts:
    name: PostgreSQL contracts (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bcc_contracts
        options: >-
          --health-cmd "pg_isready -U postgres -d bcc_contracts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BCC_REQUIRE_POSTGRES: "1"
      BCC_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bcc_contracts
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime and PostgreSQL test dependencies
        run: |
          python -m pip install -e .
          python -m pip install -e './command-center[dev]' asyncpg
      - name: Record exact source identity
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert sha == os.environ['EXPECTED_SOURCE_SHA'], 'candidate source SHA mismatch'
          pathlib.Path('postgres-source.json').write_text(json.dumps({'source_sha': sha}) + '\n')
          print('SOURCE_SHA=' + sha)
          PY
      - name: Real SQL transitions, guards and rollback
        env:
          BCC_DATA_DIR: ${{ runner.temp }}/bcc-postgres-contracts
        run: >-
          python -m pytest -c command-center/pyproject.toml
          command-center/tests/test_run_provenance_postgres.py
          command-center/tests/test_v5_terminal_run_immutability.py
          -q --tb=short --timeout=60 --junitxml=postgres-contracts.xml
      - name: Require complete PostgreSQL evidence
        run: |
          python - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          cases = ET.parse('postgres-contracts.xml').getroot().findall('.//testcase')
          live = [case for case in cases if 'test_run_provenance_postgres' in case.get('classname', '') and case.get('name', '').startswith('test_postgres_')]
          assert len(live) == 4, 'missing real PostgreSQL contract cases'
          assert all(case.find(tag) is None for case in cases for tag in ('skipped', 'failure', 'error')), 'incomplete PostgreSQL proof'
          evidence = json.loads(pathlib.Path('postgres-source.json').read_text())
          evidence.update(status='PASS', scope='POSTGRESQL_RUN_CONTRACTS', live_postgres_cases=len(live), tests=len(cases))
          pathlib.Path('postgres-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Retain exact-SHA contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-contracts-${{ env.EXPECTED_SOURCE_SHA }}-py${{ matrix.python }}
          path: |
            postgres-source.json
            postgres-contracts.xml
            postgres-evidence.json
          if-no-files-found: warn
