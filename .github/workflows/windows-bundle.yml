name: One-download Windows application
env:
  PYTHONUTF8: '1'
  BOSSMAN_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # GPL build includes libx264 used by Video Studio export. License notices and
  # source information ship in LICENSES/. The exact
  # bytes bundled are hashed into MANIFEST.json, so the archive always says what
  # it actually contains rather than what a URL promised.
  BOSSMAN_FFMPEG_ZIP: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
on:
  # Событие push, а не pull_request, и разница здесь решает всё.
  #
  # На pull_request фильтр путей считается по СОВОКУПНОМУ диффу ветки против
  # базы. В этом диффе давно лежит весь `command-center/**`, поэтому совпадение
  # есть ВСЕГДА, чем бы ни был отдельный коммит, а отрицательные пути против
  # такого диффа не значат ровно ничего.
  #
  # Доказано измерением, а не рассуждением: коммит 467e639f тронул ровно один
  # файл `docs/oss/VALIDATION-2026-09-15.md`, которого в списке путей нет вовсе,
  # и всё равно поставил в очередь сборку архива (прогон 96).
  #
  # На push тот же фильтр считается по файлам ИМЕННО ЭТОГО пуша: коммит с
  # документацией или только с тестами задание не поднимает, а продуктовый —
  # поднимает. Тот же приём уже стоит в windows-owner-tasks.yml по той же
  # причине и по тому же замеру.
  push:
    branches:
      - 'claude/**'
      - 'night/**'
    paths:
      - 'tools/build_windows_bundle.py'
      - 'tools/verify_windows_bundle.py'
      - 'tools/bundle_evening_test.py'
      - 'tools/build_local_bundle.py'
      - 'tools/verify_installed_product.py'
      - 'tools/installed_ui_sweep.py'
      - 'tools/live_openrouter_owner.py'
      - 'command-center/**'
      - 'bossman-core/**'
      - 'bossman_shared/**'
      - 'scripts/ui_acceptance_sweep.py'
      - 'tools/app_icons.py'
      - 'command-center/ui/icons/**'
      - '.github/workflows/windows-bundle.yml'
      # Коммит, меняющий ТОЛЬКО тесты, архив не меняет и очередь занимать не
      # должен. Под push эти исключения наконец работают: фильтр смотрит на
      # файлы самого пуша.
      #
      # Зачем это вообще: прогоны 88, 89, 90, 91, 92 и 94 отменены подряд, НИ
      # ОДИН не дошёл до старта, и архив с 20:09 не проверялся вовсе.
      # `cancel-in-progress: false` бережёт начавшийся прогон, а ожидающий
      # GitHub держит ровно один на группу. Гейт, который не запускается,
      # строже не становится — он молчит, и молчание читается как «проверок
      # нет», хотя выглядит как «проверки идут».
      #
      # Цена названа прямо: новый владельческий тест попадёт на установленный
      # продукт не сразу, а со следующим продуктовым коммитом. Немедленная
      # проверка доступна руками через workflow_dispatch, и полный набор тестов
      # на каждом прогоне идёт без изъятий.
      - '!command-center/tests/**'
      - '!bossman-core/tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-bundle-${{ github.ref }}
  # Finish the active exact-SHA candidate while other models keep committing.
  # GitHub retains the latest pending run in this branch's concurrency group.
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      # tools/build_source_identity.py хэширует РЕАЛЬНЫЕ байты файлов и
      # сравнивает с блобами HEAD. Windows-раннер по умолчанию разворачивает
      # текст в CRLF, и тогда каждый текстовый файл выглядит изменённым —
      # сборка честно отказывалась работать по «грязному» дереву. Машина
      # сборки не должна переписывать источник: чекаут идёт байт-в-байт, и
      # артефакт из Windows совпадает с артефактом из Linux.
      - name: Check out the source byte-for-byte, without line-ending rewriting
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build tooling only (the bundle brings its own runtime)
        run: python -m pip install --upgrade pip wheel
      - name: The canonical icon is current before it is packaged
        run: python tools/app_icons.py --check
      - name: Build the single downloadable application
        run: >-
          python tools/build_windows_bundle.py
          --out "${{ runner.temp }}/bossman-dist" --zip
      - name: Locate the archive
        shell: python
        run: |
          import os, pathlib
          dist = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bossman-dist'
          archives = sorted(dist.glob('BOSSMAN-Windows-x64-*.zip'))
          assert len(archives) == 1, archives
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('BOSSMAN_ARCHIVE=' + str(archives[0]).replace('\\', '/') + '\n')
          print(f'{archives[0].name}: {archives[0].stat().st_size} bytes')
      # Extracts into a path with spaces and drives the archive with its own
      # runtime, browser and media tools. The checkout is never on sys.path.
      # Exit codes are the verdict: 0 PASS, 1 FAIL, 2 OWNER_REQUIRED. A build
      # that is complete but needs something only the owner's machine or account
      # can supply is reported as such and is NOT painted green — and a real
      # FAIL still fails the job.
      - name: Accept the archive as a product on a clean machine
        run: |
          python tools/verify_windows_bundle.py `
            --archive "${{ env.BOSSMAN_ARCHIVE }}" `
            --expected-sha "${{ env.BOSSMAN_ACCEPTANCE_SHA }}" `
            --out "${{ runner.temp }}/bossman-dist/bundle-acceptance.json"
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            Write-Host "::warning::BOSSMAN_BUNDLE_ACCEPTANCE=OWNER_REQUIRED - the archive is complete, something only the owner can supply is missing. See bundle-acceptance.json."
            exit 0
          }
          exit $code
      - name: Report exactly what Windows verified
        if: always()
        shell: python
        run: |
          import json, os, pathlib
          result = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bossman-dist' / 'bundle-acceptance.json'
          if result.exists():
              report = json.loads(result.read_text(encoding='utf-8'))
              details = report.get('details', {})
              print(json.dumps({
                  'status': report.get('status'),
                  'source_sha': report.get('expected_sha'),
                  'archive': details.get('archive'),
                  'archive_sha256': details.get('archive_sha256'),
                  'browser': details.get('browser'),
                  'media': details.get('media'),
                  'problems': report.get('problems'),
              }, indent=2, ensure_ascii=True))
              print(details.get('evening_stdout', ''))
          else:
              print('Archive acceptance did not produce a report; inspect preceding steps.')
      - name: The build left the worktree exactly as committed
        run: python scripts/evening_owner_run.py --ci preflight
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bossman-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/bossman-dist/BOSSMAN-Windows-x64-*.zip
            ${{ runner.temp }}/bossman-dist/bundle-acceptance.json
          if-no-files-found: warn
          retention-days: 30

  owner-experience:
    needs: bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: bossman-windows-${{ env.BOSSMAN_ACCEPTANCE_SHA }}
          path: ${{ runner.temp }}/download
      - name: Extract the exact archive into an owner path with spaces
        shell: python
        run: |
          import json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          archives = list((root / 'download').glob('BOSSMAN-Windows-x64-*.zip'))
          assert len(archives) == 1, archives
          target = root / 'Owner acceptance with spaces'
          with zipfile.ZipFile(archives[0]) as archive:
              archive.extractall(target)
          manifests = list(target.glob('*/MANIFEST.json'))
          assert len(manifests) == 1, manifests
          home = manifests[0].parent
          manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
          assert manifest['source_sha'] == os.environ['BOSSMAN_ACCEPTANCE_SHA']
          proof = root / 'owner-proof'
          proof.mkdir()
          variables = {
              'BCC_ACCEPTANCE_PYTHON': str(home / 'runtime' / 'python.exe'),
              'BCC_ACCEPTANCE_SOURCE_SHA': os.environ['BOSSMAN_ACCEPTANCE_SHA'],
              'PLAYWRIGHT_BROWSERS_PATH': str(home / 'browser'),
              'BOSSMAN_EDITOR_EVIDENCE_DIR': str(proof),
              'BCC_REQUIRE_BROWSER': '1',
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              for name, value in variables.items():
                  stream.write(name + '=' + value + '\n')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as stream:
              stream.write(str(home / 'media') + '\n')
      # Test controller dependencies never modify the shipped Python runtime.
      - name: Install browser test controller
        run: python -m pip install -e . -e './bossman-core[dev]' -e './command-center[dev,browser]'
      - name: Installed browser, real media, files and process restart
        run: |
          python -m pytest tests/test_installed_ui_sweep.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -c command-center/pyproject.toml `
            command-center/tests/test_editors_user_acceptance.py `
            command-center/tests/test_web_designer_recovery_ui.py `
            command-center/tests/test_apps_files_browser_owner.py `
            command-center/tests/test_apps_files_http_owner.py `
            command-center/tests/test_images_library_ui.py `
            -q --junitxml="$env:BOSSMAN_EDITOR_EVIDENCE_DIR/results.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/require_acceptance_results.py "$env:BOSSMAN_EDITOR_EVIDENCE_DIR/results.xml" --minimum-tests 14
      # Запас времени владельческих ожиданий — в журнал, а не только в артефакт.
      # Зелёный обязан говорить, НАСКОЛЬКО он зелёный: проход за 0,2 с и проход
      # за 4,8 с при бюджете 5 с — разные утверждения о продукте, а в вердикте
      # выглядят одинаково. Артефакт весит сотни мегабайт и его мало кто
      # открывает; строка в журнале видна и человеку, и разбору красного.
      # Шаг ничего не проверяет и уронить задание не может.
      - name: Measured margins of the owner waits
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          $evidence = $env:BOSSMAN_EDITOR_EVIDENCE_DIR
          if (-not $evidence) { Write-Host 'BOSSMAN_EDITOR_EVIDENCE_DIR не задан'; exit 0 }
          $margins = Join-Path $evidence 'owner-history-margins.jsonl'
          if (Test-Path $margins) {
            Write-Host '--- owner-history-margins.jsonl ---'
            Get-Content $margins
          } else {
            Write-Host 'owner-history-margins.jsonl отсутствует: замер не дошёл до записи'
          }
      - name: Inventory visible buttons in the installed application
        if: ${{ !cancelled() && env.BCC_ACCEPTANCE_PYTHON != '' }}
        run: |
          & "$env:BCC_ACCEPTANCE_PYTHON" -I tools/installed_ui_sweep.py `
            --expected-sha "$env:BOSSMAN_ACCEPTANCE_SHA" `
            --output "$env:BOSSMAN_EDITOR_EVIDENCE_DIR/ui-sweep.json"
      - name: Genuine free-model human task smoke
        if: ${{ !cancelled() && env.BCC_ACCEPTANCE_PYTHON != '' }}
        env:
          BOSSMAN_OPENROUTER_API_KEY: ${{ secrets.BOSSMAN_OPENROUTER_API_KEY }}
        run: |
          & "$env:BCC_ACCEPTANCE_PYTHON" -I tools/live_openrouter_owner.py `
            --expected-sha "$env:BOSSMAN_ACCEPTANCE_SHA" `
            --output "$env:BOSSMAN_EDITOR_EVIDENCE_DIR/live-model.json" `
            --trajectories "$env:BOSSMAN_EDITOR_EVIDENCE_DIR/live-trajectories.jsonl"
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            Write-Host '::warning::LIVE_MODEL=OWNER_REQUIRED; see live-model.json. No model PASS is claimed.'
            exit 0
          }
          exit $code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-owner-proof-${{ env.BOSSMAN_ACCEPTANCE_SHA }}
          path: ${{ runner.temp }}/owner-proof
          retention-days: 30
          if-no-files-found: warn

  freeze:
    needs: [bundle, owner-experience]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-${{ env.BOSSMAN_ACCEPTANCE_SHA }}'
          path: ${{ runner.temp }}/freeze-evidence
      - name: Record the Astra 6 verdict against exact evidence
        if: always()
        run: >-
          python tools/astra6_freeze.py
          --evidence-dir '${{ runner.temp }}/freeze-evidence'
          --source-sha '${{ env.BOSSMAN_ACCEPTANCE_SHA }}'
          --out '${{ runner.temp }}/freeze/ASTRA6-FREEZE.json'
          --job-status '${{ needs.bundle.result }}'
          --job-status '${{ needs.owner-experience.result }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: astra6-freeze-${{ env.BOSSMAN_ACCEPTANCE_SHA }}
          path: ${{ runner.temp }}/freeze/ASTRA6-FREEZE.json
          retention-days: 30
          if-no-files-found: error
