name: TEMP command-center closure patch

on:
  push:
    branches: [release/bossman-owner]
    paths:
      - .github/workflows/zz-temp-command-center-closure.yml
  pull_request:
    types: [synchronize]
    branches: [night/v7-convergence-20260908]
    paths:
      - .github/workflows/zz-temp-command-center-closure.yml

permissions:
  contents: write

concurrency:
  group: temp-command-center-closure
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply narrow production fixes
        shell: python
        run: |
          from pathlib import Path

          engine = Path('command-center/bcc/engine.py')
          text = engine.read_text(encoding='utf-8')
          old = '''                if worker is not None and not worker.done():\n                    self._cancelling.add(run_id)\n                    worker.cancel()\n'''
          new = '''                if worker is not None and not worker.done():\n                    self._cancelling.add(run_id)\n                    # Stop may be requested from inside this same worker. Cancelling\n                    # the current task here can tear an in-process request through\n                    # DB rollback and strand a checked-out connection. Sticky task\n                    # state is observed by completion/interrupt handling after the\n                    # callback unwinds, so only cancel a different worker task.\n                    if worker is not asyncio.current_task():\n                        worker.cancel()\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stop-cancel block, found {text.count(old)}')
          engine.write_text(text.replace(old, new), encoding='utf-8')

          testing = Path('command-center/bcc/features/testing_period.py')
          text = testing.read_text(encoding='utf-8')
          old = '        "features": sorted(f.name for f in getattr(svc, "features", []) or []),\n'
          new = '''        "features": sorted({f.name for f in getattr(svc, "features", []) or []}\n                           | {"testing_period"}),\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one env feature line, found {text.count(old)}')
          testing.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/zz-temp-command-center-closure.yml').unlink()

      - name: Install targeted test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e "./command-center[dev,mcp,browser]"
          python -m pip install asyncpg redis

      - name: Diagnose imported snapshot implementation
        run: |
          python - <<'PY'
          import inspect
          import bcc.features.testing_period as tp
          from bcc.features import load_features
          print('MODULE', tp.__file__)
          print('FEATURES', [f.name for f in load_features()])
          print(inspect.getsource(tp._env_snapshot))
          PY

      - name: Verify the two exact regressions
        run: |
          python -m pytest -q \
            command-center/tests/test_engine_stop.py::test_stop_leaves_no_connection_behind \
            command-center/tests/test_testing_period.py::test_environment_snapshot_makes_two_journals_comparable

      - name: Commit and fast-forward canonical branch
        run: |
          git config user.name "bossman-closure-bot"
          git config user.email "actions@users.noreply.github.com"
          git add command-center/bcc/engine.py command-center/bcc/features/testing_period.py .github/workflows/zz-temp-command-center-closure.yml
          git diff --cached --check
          git commit -m "fix(command-center): close stop and session snapshot leaks"
          git push origin HEAD:release/bossman-owner
