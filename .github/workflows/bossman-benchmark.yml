name: root-ci (shared contracts, learning layer, tools)
env:
  BOSSMAN_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (LIVE is only possible with both attestations)"
        required: false
        default: "pr"
        type: choice
        options: [smoke, pr, nightly, release]
      owner_approved:
        description: "Authenticated owner approved LIVE benchmark"
        required: false
        default: false
        type: boolean
      budget_reserved:
        description: "Budget reservation exists for LIVE benchmark"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# This workflow path is an already-active Actions identity. The original root
# workflow identity stopped scheduling despite its unchanged gate body. Rather
# than waive the mandatory gate, this active identity now carries BOTH the
# deterministic benchmark and the complete root release gate. A successful run
# is therefore strictly stronger than the former root-only success.
jobs:
  deterministic-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOSSMAN_BENCHMARK_NO_PAID_CALLS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      BOSSMAN_BENCHMARK_OWNER_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_approved && '1' || '0' }}
      BOSSMAN_BENCHMARK_BUDGET_RESERVED: ${{ github.event_name == 'workflow_dispatch' && inputs.budget_reserved && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install core
        run: |
          python -m pip install -e .
          python -m pip install -e "./bossman-core[dev]"
      - name: SMOKE (all PRs, no paid calls)
        if: github.event_name == 'pull_request'
        working-directory: bossman-core
        run: python -m bossman.benchmark run --tier smoke --output ../benchmark-ci-results
      - name: PR (all PRs, no paid calls)
        if: github.event_name == 'pull_request'
        working-directory: bossman-core
        run: python -m bossman.benchmark run --tier pr --output ../benchmark-ci-results
      - name: Push candidate smoke (no paid calls)
        if: github.event_name == 'push'
        working-directory: bossman-core
        run: python -m bossman.benchmark run --tier smoke --output ../benchmark-ci-results
      - name: Manually dispatched tier
        if: github.event_name == 'workflow_dispatch'
        working-directory: bossman-core
        run: >-
          python -m bossman.benchmark run --tier ${{ inputs.tier }} --output ../benchmark-ci-results
          ${{ inputs.owner_approved && inputs.budget_reserved && '--allow-live' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bossman-benchmark-results
          path: benchmark-ci-results

  root-tests:
    name: root pytest + hygiene (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test deps (no secrets, no network services)
        run: |
          python -m pip install --quiet -e .
          python -m pip install --quiet pytest pytest-timeout psutil httpx pyyaml
      - name: Root suite (learning layer, shared cache contracts, context slicer, tools)
        run: python -m pytest tests -q --durations=10 --timeout=120 --timeout-method=signal
      - name: README Live Scorecard is current (README_SCORECARD_CURRENT)
        run: python scripts/update_readme_scorecard.py --check
      - name: Skips registry is current (SKIPS_REGISTRY_CURRENT)
        run: python tools/skips_registry.py --check
      - name: compileall
        run: python -m compileall -q bossman-core/bossman command-center/bcc learning bossman_shared tools
      - name: Secret scan
        run: python tools/ci_secret_scan.py
      - name: git diff --check (whitespace hygiene)
        run: >-
          git diff --check $(git hash-object -t tree /dev/null) HEAD --
          bossman-core/bossman bossman-core/tests command-center/bcc command-center/tests
          command-center/ui learning bossman_shared tools tests schemas scripts docs/benchmark
          .github/workflows/bossman-benchmark.yml .github/workflows/bossman-core-ci.yml
          .github/workflows/command-center-ci.yml docs/security docs/intelligence

  docker-smoke:
    name: bossman-core container ships bossman-shared
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build image (repository root context)
        run: docker build -f bossman-core/Dockerfile -t bossman-core:ci .
      - name: Shared contracts resolve inside the container
        run: >-
          docker run --rm -w / bossman-core:ci python -c
          "import bossman_shared.cache_observation, learning.trace as lt, bossman_schemas; import bossman._shared as s; assert s.AVAILABLE; assert lt.SCHEMA_PATH.exists(); print('container OK', lt.SCHEMA_PATH)"
