name: ASTRA acceptance
env:
  BOSSMAN_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
on:
  push:
  pull_request:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:
    inputs:
      sandbox:
        description: Run real sandbox tests on the configured private Linux runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  portable:
    name: ASTRA portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . -e ./bossman-core[dev] -e ./command-center[dev]
      - name: Core and portable persistence regressions
        run: >-
          python -m pytest bossman-core/tests/test_astra_remediation.py
          bossman-core/tests/test_v3_evidence_signing.py
          bossman-core/tests/test_v3_organization_e2e.py
          -q --timeout=120 --timeout-method=thread --junitxml=astra-core.xml
      - name: Command Center regressions
        run: >-
          python -m pytest command-center/tests/test_astra_remediation_cc.py
          -q --timeout=120 --timeout-method=thread --junitxml=astra-cc.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: astra-portable-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: astra-*.xml
          if-no-files-found: error
  runner:
    name: ASTRA runner recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -e ./command-center[dev]
      - name: ASTRA runner profile
        env:
          # The Command Center conftest feature loader imports bossman_v3 from
          # the bossman-core checkout; editable installs do not expose it, so
          # the acceptance subprocess needs both roots on the path.
          PYTHONPATH: ${{ github.workspace }}/bossman-core:${{ github.workspace }}
        run: python tools/astra_acceptance.py --profile runner
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: astra-runner-${{ github.event.pull_request.head.sha || github.sha }}
          path: astra-acceptance-results/
          if-no-files-found: error
  sandbox:
    name: ASTRA real sandbox
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox
    runs-on: [self-hosted, linux, bossman-sandbox]
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      BOSSMAN_SANDBOX_NO_EGRESS: '1'
      BOSSMAN_OFFLINE_MODE_ENABLED: '1'
      PIP_NO_INDEX: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      DOCKER_HOST: ''
      HTTP_PROXY: 'http://127.0.0.1:9'
      HTTPS_PROXY: 'http://127.0.0.1:9'
      NO_PROXY: '127.0.0.1,localhost'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify no Docker socket or secret leakage in self-hosted sandbox
        run: >-
          python -I -c "import os;
          assert os.environ.get('DOCKER_HOST') == '';
          assert os.environ.get('BOSSMAN_SANDBOX_NO_EGRESS') == '1'"
      - run: python -m pip install --no-index --no-build-isolation --no-deps -e . -e ./bossman-core
      - run: python -I tools/astra_acceptance.py --profile sandbox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        if: always()
        with:
          name: astra-sandbox-${{ github.event.pull_request.head.sha || github.sha }}
          path: astra-acceptance-results/
          if-no-files-found: error
      - name: Purge ephemeral runner state
        if: always()
        run: git clean -fdx

