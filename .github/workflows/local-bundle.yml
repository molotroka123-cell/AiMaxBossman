# Скачиваемая локальная поставка: только то, что нужно для запуска.
#
# Артефакт собирается на Linux и на Windows отдельно, потому что «собралось у
# меня» не означает «поставится у владельца»: изоляция сборки, пути и точки
# входа ведут себя по-разному. Каждый прогон СТАВИТ собранное в чистое
# окружение и проверяет импорты и команды — артефакт, который никто не пробовал
# установить, поставкой не считается.
name: Local bundle
env:
  BOSSMAN_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Attest exact Git blob bytes on Windows too; do not silently normalize
  # binary inputs or inherit a runner's global autocrlf checkout conversion.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']
    branches: ['claude/bossman-final-audit-closure-aucx9x', 'release/**']
permissions:
  contents: read
jobs:
  bundle:
    name: local bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and verify the bundle
        run: python tools/build_local_bundle.py --out dist/bossman-local
      - name: Show what is being shipped
        run: python -c "import json;m=json.load(open('dist/bossman-local/MANIFEST.json',encoding='utf-8'));print(json.dumps(m,indent=2,ensure_ascii=True))"
      - name: Install the shipped product for real browser acceptance
        if: runner.os == 'Linux'
        run: |
          python dist/bossman-local/install.py
          python -m pip install -e . -e './bossman-core[dev]' -e './command-center[dev,browser]'
          python -m playwright install --with-deps chromium
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
      - name: Installed UI, real media, safe recovery and process restart
        if: runner.os == 'Linux'
        env:
          BCC_REQUIRE_BROWSER: '1'
          BCC_ACCEPTANCE_PYTHON: ${{ github.workspace }}/dist/bossman-local/.venv/bin/python
          BCC_ACCEPTANCE_SOURCE_SHA: ${{ env.BOSSMAN_ACCEPTANCE_SHA }}
          BOSSMAN_EDITOR_EVIDENCE_DIR: ${{ runner.temp }}/installed-owner-proof
        run: |
          mkdir -p "$BOSSMAN_EDITOR_EVIDENCE_DIR"
          python -m pytest -c command-center/pyproject.toml \
            command-center/tests/test_editors_user_acceptance.py \
            command-center/tests/test_web_designer_recovery_ui.py \
            command-center/tests/test_apps_files_browser_owner.py \
            command-center/tests/test_apps_files_http_owner.py \
            -q --junitxml="$BOSSMAN_EDITOR_EVIDENCE_DIR/results.xml"
          python tools/require_acceptance_results.py "$BOSSMAN_EDITOR_EVIDENCE_DIR/results.xml" --minimum-tests 13
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with:
          name: installed-owner-proof-${{ env.BOSSMAN_ACCEPTANCE_SHA }}
          path: ${{ runner.temp }}/installed-owner-proof
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: bossman-local-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/bossman-local
            !dist/bossman-local/.venv
          if-no-files-found: error
