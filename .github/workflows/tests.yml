name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Один прогон на ветку: новый пуш отменяет предыдущий, чтобы очередь не росла.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: command-center

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          # mcp — опциональная группа: без неё рантайм честно отвечает
          # «недоступно», но в CI мы хотим прогонять и его 15 тестов
          pip install -e ".[dev,mcp]"

      - name: Браузер для Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Тесты
        env:
          # Тот же режим, что в разработке: воркеры не стартуют сами,
          # тесты сами крутят движок и не зависят от таймингов раннера.
          BCC_DATA_DIR: ${{ runner.temp }}/bcc-data
        run: |
          # Без --timeout: плагина pytest-timeout в зависимостях нет, флаг
          # уронил бы прогон. Ограничение по времени даёт timeout-minutes job'а.
          python -m pytest -q --durations=10

      - name: Секреты в диффе
        if: always()
        working-directory: .
        run: |
          # Грубая, но полезная сетка: ключи, приватные ключи, .env
          if git grep -nEI "(sk-[a-zA-Z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY)" -- . ':!docs/research/*'; then
            echo "::error::Похоже на секрет в репозитории"
            exit 1
          fi
          if git ls-files | grep -E "(^|/)\.env$|\.pem$|/token$"; then
            echo "::error::Файл, которого не должно быть в git"
            exit 1
          fi
          echo "чисто"
