name: V4 prepared patch delivery

on:
  push:
    branches: [fix/astra-v4-continuity-boundary-20260906]
    paths: [.github/workflows/v4-boundary-delivery.yml]

permissions:
  contents: read

concurrency:
  group: v4-prepared-patch-delivery
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and materialize the exact prepared edits
        run: |
          python .github/checkpoint/deliver_v4.py
          git rev-parse HEAD > "$RUNNER_TEMP/v4-delivery-results/checkout-sha.txt"
      - name: Install declared component test dependencies
        run: python -m pip install -e . -e './bossman-core[dev]' -e './command-center[dev]'
      - name: Core authorization and resume regression with real process deadline
        working-directory: bossman-core
        env:
          BOSSMAN_WATCHDOG_TIMEOUT_SECONDS: '480'
        run: >-
          python ../tools/pytest_watchdog.py tests/test_epoch4_effect_boundary.py
          tests/test_epoch4_bcc_authority.py tests/test_v3_command_center_adapters.py
          tests/test_v3_compound_resume.py tests/test_v3_invariants.py
          -q --timeout=60 --junitxml=${{ runner.temp }}/v4-delivery-results/core.xml
      - name: Canonical mission, queue, finalizer and fencing regression
        working-directory: command-center
        env:
          BOSSMAN_WATCHDOG_TIMEOUT_SECONDS: '360'
        run: >-
          python ../tools/pytest_watchdog.py tests/test_epoch4_mission_continuity.py
          tests/test_feat_missions.py tests/test_finalize_gate.py tests/test_fence_fl01.py
          -q --timeout=60 --junitxml=${{ runner.temp }}/v4-delivery-results/cc.xml
      - name: UI contracts, secret scan and whitespace (not visible UI acceptance)
        run: |
          node --test command-center/tests/js/mission_continuity.test.mjs
          python tools/ci_secret_scan.py
          git diff --check
      - name: Preserve actual results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-delivery-validation-${{ github.sha }}
          path: ${{ runner.temp }}/v4-delivery-results/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct identical validated files and remove only our delivery scaffolding
        run: python .github/checkpoint/deliver_v4.py --remove-scaffold
      - name: Publish only to the isolated branch, no force and no merge
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          remote=$(git ls-remote origin refs/heads/fix/astra-v4-continuity-boundary-20260906 | cut -f1)
          test "$remote" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bossman-core/bossman_v3/adapters/command_center.py bossman-core/bossman_v3/execution/compound.py bossman-core/tests/test_epoch4_bcc_authority.py command-center/bcc/engine.py command-center/bcc/features/missions.py command-center/bcc/mission_continuity.py command-center/bcc/tools.py command-center/tests/js/mission_continuity.test.mjs command-center/tests/test_epoch4_mission_continuity.py command-center/ui/mission_state.js command-center/ui/pages/missions.js docs/v4/CONTINUITY_PATCH_RUN_20260906.md
          git add -u -- .github/checkpoint/deliver_v4.py .github/checkpoint/v4_payload_0.txt .github/checkpoint/v4_payload_1.txt .github/checkpoint/v4_payload_2.txt .github/workflows/v4-boundary-delivery.yml
          git diff --cached --check
          git commit -m 'fix(v4): deliver mission dependencies, lifecycle and full approval binding' -m 'Validated prepared postimages on Python 3.12; read CI artifacts for actual results. No UI candidate movement, standing-autonomy activation, full regression or live UI acceptance claim. Historical CONTINUITY_PATCH_RUN records the original offline run, not this delivery.'
          git push origin HEAD:refs/heads/fix/astra-v4-continuity-boundary-20260906
          git rev-parse HEAD > "$RUNNER_TEMP/v4-delivery-results/remote-commit.txt"
      - name: Retain delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-delivery-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/v4-delivery-results/
          if-no-files-found: error
          retention-days: 14
