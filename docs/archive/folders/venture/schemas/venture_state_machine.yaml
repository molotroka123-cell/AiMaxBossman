states:
  - NEW
  - TRIAGE
  - RESEARCHING
  - VALIDATION_CANDIDATE
  - VALIDATING
  - BUILD_CANDIDATE
  - BUILDING
  - PILOT
  - SCALE
  - HOLD
  - KILLED

default_transitions:
  NEW: [TRIAGE, KILLED]
  TRIAGE: [RESEARCHING, HOLD, KILLED]
  RESEARCHING: [VALIDATION_CANDIDATE, HOLD, KILLED]
  VALIDATION_CANDIDATE: [VALIDATING, HOLD, KILLED]
  VALIDATING: [BUILD_CANDIDATE, HOLD, KILLED]
  BUILD_CANDIDATE: [BUILDING, HOLD, KILLED]
  BUILDING: [PILOT, HOLD, KILLED]
  PILOT: [SCALE, HOLD, KILLED]
  SCALE: [HOLD, KILLED]
  HOLD: [RESEARCHING, VALIDATION_CANDIDATE, KILLED]
  KILLED: [TRIAGE]

rules:
  killed_revival_requires_new_trigger: true
  scale_requires_payment_evidence: true
  build_bypass_requires_owner_approval: true
