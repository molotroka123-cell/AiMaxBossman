<title>Bossman Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --side:#EDEDEA; --sunk:#F0F0ED;
  --text:#1B1C1A; --muted:#6A6C67; --faint:#9A9C97; --line:#E1E1DD; --line-strong:#CFCFCA;
  --accent:#2F5E8C; --accent-soft:#E6EDF4; --on-accent:#FFFFFF;
  --stop:#C2412E; --stop-soft:#F8E6E2; --ok:#2F7A4E; --ok-soft:#E3F1E8; --warn:#9A6A12; --warn-soft:#F7EED9;
  --shadow:0 1px 2px rgba(20,22,20,.06),0 8px 24px rgba(20,22,20,.06);
  --font:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#161716; --surface:#1E1F1E; --side:#111211; --sunk:#1A1B1A;
    --text:#ECECE8; --muted:#A1A39D; --faint:#71736E; --line:#2B2D2B; --line-strong:#3A3C3A;
    --accent:#8DB3DC; --accent-soft:#1F2B38; --on-accent:#0F1A26;
    --stop:#E8735F; --stop-soft:#3A221E; --ok:#6FC18F; --ok-soft:#1B2E23; --warn:#D9A945; --warn-soft:#352B17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161716; --surface:#1E1F1E; --side:#111211; --sunk:#1A1B1A;
  --text:#ECECE8; --muted:#A1A39D; --faint:#71736E; --line:#2B2D2B; --line-strong:#3A3C3A;
  --accent:#8DB3DC; --accent-soft:#1F2B38; --on-accent:#0F1A26;
  --stop:#E8735F; --stop-soft:#3A221E; --ok:#6FC18F; --ok-soft:#1B2E23; --warn:#D9A945; --warn-soft:#352B17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:268px 1fr;height:100%}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:12px 10px}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.brand{font-weight:600;letter-spacing:-.01em;font-size:16px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.newchat{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-weight:500}
.newchat:hover{background:var(--sunk)}
.search{margin:6px 0 10px;display:flex;align-items:center;gap:8px;padding:0 10px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.search input{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:14px;outline:none;min-width:0}
.search svg{width:15px;height:15px;color:var(--faint);flex:none}
.chats{flex:1;overflow-y:auto;min-height:0;margin:0 -2px;padding:0 2px}
.group{font-size:12px;color:var(--faint);padding:14px 10px 4px;letter-spacing:.02em}
.chatlink{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.chatlink:hover{background:var(--sunk)}
.chatlink[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.side-foot{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:14px;width:100%;text-align:left}
.navbtn:hover{background:var(--sunk)}
.navbtn svg{width:17px;height:17px;color:var(--muted)}
.machine{margin-top:6px;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;gap:6px}
.machine-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.meter{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;width:23%;background:var(--ok);border-radius:4px}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid transparent}
.top h1{font-size:15px;font-weight:500;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.menu-only{display:none}
.route{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.route:hover{border-color:var(--line-strong)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.cloud{background:var(--warn)}
.route .cost{color:var(--muted)}
.feed{flex:1;overflow-y:auto;min-height:0;padding:8px 16px 24px}
.col{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.proto-note{align-self:center;font-size:12px;color:var(--faint);padding:4px 10px;border:1px dashed var(--line-strong);border-radius:999px}

.msg-user{align-self:flex-end;max-width:82%;background:var(--sunk);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 6px 18px}
.msg-user p{margin:0}
.msg-bot{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.avatar{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--text);color:var(--bg)}
.avatar.jeff{background:var(--accent);color:var(--on-accent)}
.bot-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.bot-body p{margin:0}
.who{font-size:12.5px;color:var(--muted);font-weight:500}
.bot-body ul{margin:0;padding-left:20px}
.attach{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13.5px;max-width:100%}
.attach svg{width:18px;height:18px;color:var(--muted);flex:none}
.attach .meta{color:var(--muted);font-size:12.5px}
.attach-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:6px}

/* steps */
.steps{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.steps-head{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;font-size:13.5px;color:var(--muted);text-align:left}
.steps-head:hover{color:var(--text)}
.steps-head .chev{margin-left:auto;transition:transform .2s}
.steps[data-open="true"] .chev{transform:rotate(180deg)}
.steps ol{list-style:none;margin:0;padding:0 12px 10px 34px;display:none;gap:6px;font-size:13.5px}
.steps[data-open="true"] ol{display:grid}
.steps li{display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.steps li.done{color:var(--text)}
.steps li .t{margin-left:auto;color:var(--faint)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{color:var(--ok);flex:none}

/* approval */
.approval{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.approval .ttl{font-weight:600;font-size:14.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.stop{background:var(--stop-soft);color:var(--stop)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:10px;font-weight:500;font-size:14px;border:1px solid var(--line-strong);background:var(--surface)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.9}
.decided{font-size:13.5px;color:var(--muted)}

/* voice */
.voice{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-width:420px}
.play{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}
.play svg{width:16px;height:16px}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:28px;min-width:0}
.wave i{flex:1;background:var(--line-strong);border-radius:2px;min-width:2px}
.wave i.on{background:var(--accent)}
.voice .dur{color:var(--muted)}
.linkish{font-size:13px;color:var(--accent);padding:0;text-align:left}
.linkish:hover{text-decoration:underline}
.transcript{font-size:14px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:12px;margin:0}
.profile{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;display:grid;gap:10px}
.segs{display:flex;gap:4px;align-items:flex-end;height:34px}
.segs i{flex:1;border-radius:3px;background:var(--accent-soft)}
.segs i.pick{background:var(--accent)}
.note-stop{font-size:13.5px;color:var(--stop);display:flex;gap:8px;align-items:center}

/* composer */
.composer-wrap{padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
.composer{max-width:740px;margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow);padding:10px 10px 8px 14px;display:grid;gap:6px}
.composer textarea{width:100%;border:0;resize:none;background:none;color:var(--text);font:inherit;font-size:15px;outline:none;max-height:180px;min-height:26px;padding:4px 0}
.composer textarea::placeholder{color:var(--faint)}
.bar{display:flex;align-items:center;gap:4px}
.bar .spacer{flex:1}
.model{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;font-size:13px;color:var(--muted)}
.model:hover{background:var(--sunk);color:var(--text)}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:var(--bg)}
.send:disabled{opacity:.3;cursor:default}
.send.stop{background:var(--stop);color:#fff}
.send svg{width:16px;height:16px}
.hint{max-width:740px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--faint)}

/* popovers / sheets */
.pop{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:240px}
.pop button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-size:14px}
.pop button:hover{background:var(--sunk)}
.pop small{display:block;color:var(--muted);font-size:12.5px}
.pop svg{width:17px;height:17px;color:var(--muted);flex:none;margin-top:2px}
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.35);z-index:40}
.sheet{position:fixed;z-index:50;inset:auto 0 0 0;margin:0 auto;max-width:860px;max-height:82%;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:grid;gap:16px}
.sheet h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.catgroup h3{margin:0 0 8px;font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tool{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);display:grid;gap:2px}
.tool:hover{border-color:var(--line-strong);background:var(--sunk)}
.tool b{font-weight:500;font-size:14px}
.tool span{font-size:12.5px;color:var(--muted)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:60;inset:0 auto 0 0;width:86%;max-width:320px;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .menu-only{display:grid}
  .route .cost{display:none}
  #routeName{max-width:118px;overflow:hidden;text-overflow:ellipsis}
  .top h1{font-size:14px}
  .msg-user{max-width:90%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <aside class="side" id="side" aria-label="Разговоры">
    <div class="side-top">
      <span class="brand">Bossman</span>
      <button class="iconbtn" id="themeBtn" title="Сменить тему" aria-label="Сменить тему"><svg><use href="#i-moon"/></svg></button>
    </div>
    <button class="newchat" id="newChat"><svg width="18" height="18"><use href="#i-plus"/></svg>Новый чат</button>
    <label class="search"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="Поиск по чатам" aria-label="Поиск по чатам"></label>
    <nav class="chats" id="chats"></nav>
    <div class="side-foot">
      <button class="navbtn" id="toolsBtn"><svg><use href="#i-grid"/></svg>Инструменты</button>
      <button class="navbtn" id="settingsBtn"><svg><use href="#i-gear"/></svg>Настройки</button>
      <div class="machine" aria-label="Состояние компьютера">
        <div class="machine-row"><span>Ryzen AI Max+ 395</span><span class="mono">локально</span></div>
        <div class="meter" aria-hidden="true"><i></i></div>
        <div class="machine-row"><span>Память</span><span class="mono">99 из 128 ГБ свободно</span></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="iconbtn menu-only" id="menuBtn" aria-label="Открыть список чатов"><svg><use href="#i-menu"/></svg></button>
      <h1 id="title"></h1>
      <button class="route" id="routeBtn" aria-haspopup="true"><span class="dot" id="routeDot"></span><span id="routeName">Локально · Qwen3 27B</span><span class="cost mono" id="routeCost">0 ₽</span></button>
    </header>

    <div class="feed" id="feed"><div class="col" id="col"></div></div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Напишите Bossman или Jeff…" aria-label="Сообщение"></textarea>
        <div class="bar">
          <button type="button" class="iconbtn" id="attachBtn" aria-label="Прикрепить"><svg><use href="#i-clip"/></svg></button>
          <button type="button" class="iconbtn" id="micBtn" aria-label="Записать голосовое"><svg><use href="#i-mic"/></svg></button>
          <button type="button" class="model" id="agentBtn"><span class="lbl" id="agentName">Bossman</span><svg width="14" height="14"><use href="#i-down"/></svg></button>
          <span class="spacer"></span>
          <button type="submit" class="send" id="send" aria-label="Отправить" disabled><svg><use href="#i-up"/></svg></button>
        </div>
      </form>
      <p class="hint" id="hint">Действия на компьютере — только после вашего «Разрешить». Пока Bossman работает, кнопка отправки становится «Стоп».</p>
    </div>
  </main>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const chats = [

/* ---------- sidebar ---------- */
function renderChats(){
  const q = $('#q').value.trim().toLowerCase();
  let html = '', last = '';
  chats.filter(c => !q || c.title.toLowerCase().includes(q)).forEach(c => {
    if (c.group !== last){ html += `<div class="group">${esc(c.group)}</div>`; last = c.group; }
    html += `<button class="chatlink" data-id="${c.id}" aria-current="${c===cur}">${esc(c.title)}</button>`;
  });
  $('#chats').innerHTML = html || '<div class="group">Ничего не найдено</div>';
}
$('#chats').addEventListener('click', e => {
  const b = e.target.closest('.chatlink'); if (!b) return;
  cur = chats.find(c => c.id === b.dataset.id); stopWork(false); render(); closeSide();
});
$('#q').addEventListener('input', renderChats);
$('#newChat').addEventListener('click', () => {
  const c = {id:'n'+Date.now(), title:'Новый чат', group:'Сегодня', route:{name:'Локально · Qwen3 27B', cost:'0 ₽', cloud:false}, msgs:[]};
  chats.unshift(c); cur = c; render(); closeSide(); $('#input').focus();
});

/* ---------- feed ---------- */
function wave(n, seed){ let s = seed, h=''; for (let i=0;i<n;i++){ s=(s*9301+49297)%233280; h+=`<i style="height:${20+Math.round((s/233280)*80)}%"></i>`; } return h; }
function renderMsg(m, i){
  if (m.t==='note') return `<div class="proto-note">${esc(m.text)}</div>`;
  if (m.t==='user'){
    const files = (m.files||[]).map(f => `<span class="attach"><svg><use href="#${f.icon}"/></svg><span>${esc(f.name)}</span><span class="meta mono">${esc(f.meta)}</span></span>`).join('');
    return `<div class="msg-user">${files?`<div class="attach-row">${files}</div>`:''}<p>${esc(m.text)}</p></div>`;
  }
  const av = m.who==='Jeff' ? '<div class="avatar jeff">J</div>' : '<div class="avatar">B</div>';
  const wrap = inner => `<div class="msg-bot">${av}<div class="bot-body">${inner}</div></div>`;
  if (m.t==='bot') return wrap(m.html);
  if (m.t==='steps'){
    const items = m.items.map((it,k) => {
      const done = m.done || k < (m.progress||0);
      const icon = done ? '<span class="tick">✓</span>' : (k===(m.progress||0) ? '<span class="spin"></span>' : '<span style="width:14px"></span>');
      return `<li class="${done?'done':''}">${icon}<span>${esc(it[0])}</span><span class="t mono">${done?esc(it[1]):''}</span></li>`;
    }).join('');
    const head = m.done ? esc(m.title) : 'Bossman работает…';
    const lead = m.done ? '<span class="tick">✓</span>' : '<span class="spin"></span>';
    return wrap(`<div class="steps" data-open="${!!m.open}" data-i="${i}"><button class="steps-head" data-act="toggle" data-i="${i}" aria-expanded="${!!m.open}">${lead}<span>${head}</span><svg class="chev" width="16" height="16"><use href="#i-down"/></svg></button><ol>${items}</ol></div>`);
  }
  if (m.t==='approval'){
    const rows = m.rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('');
    let foot;
    if (m.state==='pending') foot = `<div class="actions"><button class="btn primary" data-act="approve" data-i="${i}">Разрешить</button><button class="btn" data-act="deny" data-i="${i}">Отклонить</button></div>`;
    else if (m.state==='approved') foot = `<p class="decided"><span class="chip ok">Разрешено</span> Файл сохранён, Bossman проверил, что он на месте.</p>`;
    else foot = `<p class="decided"><span class="chip stop">Отклонено</span> Ничего не сделано.</p>`;
    return wrap(`<div class="approval"><div class="ttl">${esc(m.title)} <span class="chip">${esc(m.risk)}</span></div><dl class="kv">${rows}</dl>${foot}</div>`);
  }
  if (m.t==='profile'){
    const bars = [30,55,80,40,90,65,20,75,50,85,35,70,95,45,60,25].map((h,k)=>`<i class="${[2,4,7,9,12,13,5,11].includes(k)?'pick':''}" style="height:${h}%"></i>`).join('');
    return wrap(`<p>Профиль голоса готов. Из 15 минут взял 8 фрагментов по 10–25 секунд — чистая речь без музыки и чужих голосов. Нашёл три манеры: спокойная, разговорная, энергичная.</p>
      <div class="profile"><div class="segs" aria-label="Выбранные фрагменты записи">${bars}</div>
      <dl class="kv"><dt>Голос</dt><dd>Владелец · русский</dd><dt>Модель</dt><dd class="mono">Qwen3-TTS 1.7B · локально</dd><dt>Где хранится</dt><dd>только на этом компьютере</dd></dl>
      <div class="actions"><button class="btn" data-act="sample">Послушать пример</button><button class="btn">Удалить профиль</button></div></div>`);
  }
  if (m.t==='voice'){
    const on = m.playing ? Math.round((m.pos||0)*40) : 0;
    let w = wave(40, 7); if (on) { let n=0; w = w.replace(/<i /g, s => (n++ < on) ? '<i class="on" ' : s); }
    return wrap(`<div class="who">Jeff · голосовое в Telegram</div>
      <div class="voice"><button class="play" data-act="play" data-i="${i}" aria-label="${m.playing?'Пауза':'Слушать'}"><svg><use href="#${m.playing?'i-pause':'i-play'}"/></svg></button><div class="wave">${w}</div><span class="dur mono">0:${String(m.dur).padStart(2,'0')}</span></div>
      <div><span class="chip info">${esc(m.bg)}</span></div>
      ${m.showText?`<p class="transcript">${esc(m.transcript)}</p>`:''}
      <button class="linkish" data-act="text" data-i="${i}">${m.showText?'Скрыть текст':'Показать текст'}</button>`);
  }
  return '';
}
function render(){
  $('#title').textContent = cur.title;
  $('#routeName').textContent = cur.route.name;
  $('#routeCost').textContent = cur.route.cost;
  $('#routeDot').className = 'dot' + (cur.route.cloud ? ' cloud' : '');
  const col = $('#col');
  col.innerHTML = cur.msgs.length ? cur.msgs.map(renderMsg).join('') :
    `<div style="padding-top:18vh;text-align:center;display:grid;gap:8px"><div style="font-size:22px;font-weight:600;letter-spacing:-.01em">Чем займёмся?</div><div style="color:var(--muted)">Напишите задачу, прикрепите файл или запишите голосовое.</div></div>`;
  renderChats(); syncSend();
  const f = $('#feed'); f.scrollTop = f.scrollHeight;
}
$('#col').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const m = cur.msgs[+b.dataset.i];
  const a = b.dataset.act;
  if (a==='toggle'){ m.open = !m.open; const st = b.closest('.steps'); st.dataset.open = m.open; b.setAttribute('aria-expanded', m.open); return; }
  if (a==='approve'){ m.state='approved'; cur.msgs.push({t:'bot', html:'<p>Сохранил <span class="mono">report_youtube_26-09.txt</span> на рабочий стол — 1 240 слов, проверил, что файл открывается.</p>'}); render(); return; }
  if (a==='deny'){ m.state='denied'; render(); return; }
  if (a==='text'){ m.showText = !m.showText; render(); return; }
  if (a==='play'){ togglePlay(m); return; }
  if (a==='sample'){ const v = cur.msgs.find(x=>x.t==='voice'); if (v) togglePlay(v); }
});

let raf = null;
function togglePlay(m){
  cur.msgs.forEach(x => { if (x!==m) x.playing=false; });
  m.playing = !m.playing; cancelAnimationFrame(raf);
  if (m.playing){
    const start = performance.now() - (m.pos||0)*m.dur*1000;
    const tick = t => { m.pos = Math.min(1,(t-start)/(m.dur*1000)); if (m.pos>=1){ m.playing=false; m.pos=0; } render(); if (m.playing) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  } else render();
}

/* ---------- composer ---------- */
const input = $('#input');
function syncSend(){
  const s = $('#send');
  if (working){ s.disabled=false; s.classList.add('stop'); s.innerHTML='<svg><use href="#i-stop"/></svg>'; s.setAttribute('aria-label','Остановить'); }
  else { s.classList.remove('stop'); s.innerHTML='<svg><use href="#i-up"/></svg>'; s.setAttribute('aria-label','Отправить'); s.disabled = !input.value.trim(); }
}
input.addEventListener('input', () => { input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,180)+'px'; syncSend(); });
input.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#composer').requestSubmit(); } });
$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  if (working){ stopWork(true); return; }
  const text = input.value.trim(); if (!text) return;
  if (cur.title==='Новый чат') cur.title = text.length>38 ? text.slice(0,38)+'…' : text;
  cur.msgs.push({t:'user', text}); input.value=''; input.style.height='auto';
  const steps = {t:'steps', done:false, open:true, progress:0, title:'Готово', items:[['Понял задачу','0:01'],['Выбрал маршрут: локальная модель','0:01'],['Собрал ответ','0:04']]};
  cur.msgs.push(steps); working = {chat:cur, steps, timers:[]};
  steps.items.forEach((_,k) => working.timers.push(setTimeout(() => { steps.progress = k+1; if (cur===working?.chat) render(); }, 900*(k+1))));
  working.timers.push(setTimeout(() => {
    steps.done = true; steps.open = false; steps.title = 'Готово за 4 с';
    working.chat.msgs.push({t:'bot', html:'<p>Это прототип: здесь будет настоящий ответ Bossman из того же backend, что и сейчас. Одобрения, STOP и голос работают так же, просто живут прямо в разговоре.</p>'});
    const c = working.chat; working = null; if (cur===c) render();
  }, 900*steps.items.length + 500));
  render();
});
function stopWork(note){
  if (!working) return;
  working.timers.forEach(clearTimeout);
  const {chat, steps} = working; working = null;
  steps.done = true; steps.title = 'Остановлено на шаге ' + (steps.progress+1); steps.open = false;
  if (note) chat.msgs.push({t:'bot', html:'<p class="note-stop">■ Остановлено по вашей команде. Дальше Bossman ничего не делает, пока вы не напишете.</p>'});
  if (cur===chat) render();
}

/* ---------- popovers & sheets ---------- */
const layer = $('#layer');
function closeLayer(){ layer.innerHTML=''; }
function popover(anchor, html, above){
  closeLayer();
  const r = anchor.getBoundingClientRect();
  layer.innerHTML = `<div class="scrim" style="background:transparent" data-close></div><div class="pop" role="menu">${html}</div>`;
  const p = layer.querySelector('.pop');
  const left = Math.max(12, Math.min(r.left, innerWidth - p.offsetWidth - 12));
  p.style.left = left+'px';
  if (above) p.style.top = (r.top - p.offsetHeight - 8)+'px'; else p.style.top = (r.bottom + 8)+'px';
}
layer.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeLayer(); return; }
  const b = e.target.closest('[data-route]');
  if (b){ const [name,cloud] = b.dataset.route.split('|'); cur.route = {name, cost:'0 ₽', cloud: cloud==='1'}; closeLayer(); render(); return; }
  const ag = e.target.closest('[data-agent]');
  if (ag){ $('#agentName').textContent = ag.dataset.agent; input.placeholder = 'Напишите ' + ag.dataset.agent + '…'; closeLayer(); return; }
  const at = e.target.closest('[data-attach]');
  if (at){ closeLayer(); input.value = at.dataset.attach; input.dispatchEvent(new Event('input')); input.focus(); }
});
document.addEventListener('keydown', e => { if (e.key==='Escape'){ closeLayer(); closeSide(); } });
