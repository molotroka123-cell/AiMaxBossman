<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Как работает Bossman</title><desc id="desc">Пользователь в интерфейсе или Telegram. Политики и делегирование в исполнителей. Результаты проверяются. Локальные модели; облако только по согласию. У Telegram нет прямого пути к shell.</desc><rect width="1000" height="530" rx="22" fill="#0b1020"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="49" fill="#eaf2ff" font-size="28" font-weight="700" text-anchor="start">Одна система — разные исполнители</text><text x="40" y="80" fill="#a6b8d2" font-size="14" font-weight="400" text-anchor="start">Упрощённая схема существующих слоёв; не доказательство живой приёмки.</text><rect x="40" y="115" width="420" height="72" rx="14" fill="#111b30" stroke="#263855"/><text x="60" y="144" fill="#eaf2ff" font-size="20" font-weight="600" text-anchor="start">Ты в интерфейсе</text><text x="60" y="170" fill="#a6b8d2" font-size="14" font-weight="400" text-anchor="start">Задание · проект · проверка</text><rect x="540" y="115" width="420" height="72" rx="14" fill="#111b30" stroke="#263855"/><text x="560" y="144" fill="#eaf2ff" font-size="20" font-weight="600" text-anchor="start">Ты в Telegram</text><text x="560" y="170" fill="#a6b8d2" font-size="14" font-weight="400" text-anchor="start">Беседа · поручение · статус</text><path d="M250 187V218H500V245M750 187V218H500" stroke="#68d9ff" fill="none" stroke-width="2"/><rect x="210" y="245" width="580" height="81" rx="14" fill="#111b30" stroke="#263855"/><text x="500" y="275" fill="#eaf2ff" font-size="21" font-weight="600" text-anchor="middle">Права → очередь → назначенный агент</text><text x="500" y="301" fill="#a6b8d2" font-size="15" font-weight="400" text-anchor="middle">never / ask / allowed · лимиты · изоляция</text><path d="M500 326V351M188 370V351H813V370" stroke="#68d9ff" fill="none" stroke-width="2"/><rect x="40" y="370" width="290" height="73" rx="14" fill="#111b30" stroke="#263855"/><text x="185" y="399" fill="#eaf2ff" font-size="18" font-weight="600" text-anchor="middle">Локальные модели</text><text x="185" y="424" fill="#a6b8d2" font-size="12" font-weight="400" text-anchor="middle">LLM · vision · media</text><rect x="355" y="370" width="290" height="73" rx="14" fill="#111b30" stroke="#263855"/><text x="500" y="399" fill="#eaf2ff" font-size="18" font-weight="600" text-anchor="middle">Инструменты</text><text x="500" y="424" fill="#a6b8d2" font-size="12" font-weight="400" text-anchor="middle">Файлы · браузер · редакторы</text><rect x="670" y="370" width="290" height="73" rx="14" fill="#111b30" stroke="#263855"/><text x="815" y="399" fill="#eaf2ff" font-size="18" font-weight="600" text-anchor="middle">Облачный резерв</text><text x="815" y="424" fill="#a6b8d2" font-size="12" font-weight="400" text-anchor="middle">Явное согласие + бюджет</text><text x="500" y="481" fill="#a6edb0" font-size="20" font-weight="600" text-anchor="middle">Проверенный эффект → журнал → результат владельцу</text><text x="500" y="509" fill="#a6b8d2" font-size="12" font-weight="400" text-anchor="middle">Ответ «готово» сам по себе не закрывает задачу. Выключенный ПК требует внешнего relay.</text></g></svg>
