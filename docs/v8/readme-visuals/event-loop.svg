<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Телеметрия без блокировки интерфейса</title><desc id="desc">Контролируемое чтение с задержкой 250 миллисекунд. Медианная задержка независимого callback: до 240.744, после 0.352 миллисекунды. Это Linux-контроль, не Windows или скорость модели.</desc><rect width="1000" height="490" rx="22" fill="#0b1020"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="52" fill="#eaf2ff" font-size="26" font-weight="700" text-anchor="start">Медленный датчик больше не задерживает весь цикл</text><text x="40" y="83" fill="#a6b8d2" font-size="15" font-weight="400" text-anchor="start">20 чередующихся пар · искусственная задержка чтения 250 мс · Linux</text><path d="M210.0 124V277" stroke="#263855"/><text x="210.0" y="306" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">0</text><path d="M335.0 124V277" stroke="#263855"/><text x="335.0" y="306" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">50</text><path d="M460.0 124V277" stroke="#263855"/><text x="460.0" y="306" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">100</text><path d="M585.0 124V277" stroke="#263855"/><text x="585.0" y="306" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">150</text><path d="M710.0 124V277" stroke="#263855"/><text x="710.0" y="306" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">200</text><path d="M835.0 124V277" stroke="#263855"/><text x="835.0" y="306" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">250</text><text x="44" y="173" fill="#eaf2ff" font-size="19" font-weight="600" text-anchor="start">До</text><rect x="210" y="150" width="601.861" height="33" rx="1" fill="#8d9dff"/><text x="823.861185" y="174" fill="#8d9dff" font-size="18" font-weight="600" text-anchor="start">240.744 мс</text><text x="44" y="254" fill="#eaf2ff" font-size="19" font-weight="600" text-anchor="start">После</text><rect x="210" y="231" width="0.880" height="33" rx="1" fill="#a6edb0"/><text x="222.880435" y="255" fill="#a6edb0" font-size="18" font-weight="600" text-anchor="start">0.352 мс</text><text x="830" y="331" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="end">Задержка callback, мс</text><rect x="40" y="351" width="920" height="96" rx="14" fill="#111b30" stroke="#263855"/><text x="59" y="382" fill="#eaf2ff" font-size="17" font-weight="600" text-anchor="start">Само медленное чтение: 250.706 → 251.219 мс.</text><text x="59" y="411" fill="#a6b8d2" font-size="15" font-weight="400" text-anchor="start">Улучшена отзывчивость цикла, а не ускорен датчик или inference.</text><text x="40" y="472" fill="#a6b8d2" font-size="12" font-weight="400" text-anchor="start">Источник: docs/v8/evidence/metrics-async-summary.json · НЕ тест целевого Ryzen</text></g></svg>
