<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Расширение Windows-приёмки</title><desc id="desc">В четырёх исторических принятых кандидатах профиль содержал 40,42,44,46 сценариев; все прошли. Это разные наборы и разные SHA, не процент готовности V8.</desc><rect width="1000" height="470" rx="22" fill="#0b1020"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="50" fill="#eaf2ff" font-size="26" font-weight="700" text-anchor="start">Windows: всё больше пользовательских сценариев</text><text x="40" y="80" fill="#a6b8d2" font-size="15" font-weight="400" text-anchor="start">Принятые исторические кандидаты · результаты относятся к каждому своему ZIP</text><path d="M240 104V364" stroke="#263855"/><text x="240" y="391" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">0</text><path d="M360 104V364" stroke="#263855"/><text x="360" y="391" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">10</text><path d="M480 104V364" stroke="#263855"/><text x="480" y="391" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">20</text><path d="M600 104V364" stroke="#263855"/><text x="600" y="391" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">30</text><path d="M720 104V364" stroke="#263855"/><text x="720" y="391" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">40</text><path d="M840 104V364" stroke="#263855"/><text x="840" y="391" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="middle">50</text><text x="40" y="139" fill="#a6b8d2" font-size="15" font-weight="400" text-anchor="start">16 SEP · 5364d2cd</text><rect x="240" y="120" width="480" height="28" rx="4" fill="#68d9ff"/><text x="732" y="141" fill="#eaf2ff" font-size="17" font-weight="700" text-anchor="start">40/40</text><text x="40" y="159" fill="#a6b8d2" font-size="11" font-weight="400" text-anchor="start">run 108</text