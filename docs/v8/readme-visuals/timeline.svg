<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">История работы с 10 сентября</title><desc id="desc">10–11 сентября: корпуса и сведение. 14–15: UX и Windows. 16–17: архив и строгая приёмка. 18: Studio, телеметрия, Telegram. Полный релиз ещё не принят.</desc><rect width="1000" height="470" rx="22" fill="#0b1020"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="50" fill="#eaf2ff" font-size="28" font-weight="700" text-anchor="start">10–18 сентября 2026: от сведения к V8</text><text x="40" y="82" fill="#a6b8d2" font-size="14" font-weight="400" text-anchor="start">Часовой пояс UTC−04 для истории поездки; точные даты коммитов — в аудите.</text><rect x="40" y="114" width="440" height="112" rx="14" fill="#111b30" stroke="#263855"/><text x="60" y="143" fill="#68d9ff" font-size="14" font-weight="600" text-anchor="start">10–11 SEP</text><text x="60" y="174" fill="#eaf2ff" font-size="20" font-weight="600" text-anchor="start">Сведение и память</text><text x="60" y="203" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="start">Корпуса, context store, recovery</text><rect x="520" y="114" width="440" height="112" rx="14" fill="#111b30" stroke="#263855"/><text x="540" y="143" fill="#68d9ff" font-size="14" font-weight="600" text-anchor="start">14–15 SEP</text><text x="540" y="174" fill="#eaf2ff" font-size="20" font-weight="600" text-anchor="start">Рабочий Windows-кандидат</text><text x="540" y="203" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="start">GrapesJS, OSS, живой интерфейс</text><rect x="40" y="247" width="440" height="112" rx="14" fill="#111b30" stroke="#263855"/><text x="60" y="276" fill="#68d9ff" font-size="14" font-weight="600" text-anchor="start">16–17 SEP</text><text x="60" y="307" fill="#eaf2ff" font-size="20" font-weight="600" text-anchor="start">Один архив, строгая приёмка</text><text x="60" y="336" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="start">40 → 42 → 44 теста; привязка к ZIP</text><rect x="520" y="247" width="440" height="112" rx="14" fill="#111b30" stroke="#263855"/><text x="540" y="276" fill="#68d9ff" font-size="14" font-weight="600" text-anchor="start">18 SEP</text><text x="540" y="307" fill="#eaf2ff" font-size="20" font-weight="600" text-anchor="start">Studio, Telegram, отзывчивость</text><text x="540" y="336" fill="#a6b8d2" font-size="13" font-weight="400" text-anchor="start">46 тестов baseline; live ещё впереди</text><text x="40" y="420" fill="#a6edb0" font-size="15" font-weight="400" text-anchor="start">Следующий этап: один точный ZIP + локальная модель + владельческий GUI-прогон.</text><text x="40" y="450" fill="#a6b8d2" font-size="12" font-weight="400" text-anchor="start">Никаких придуманных октябрьских дат, процентов готовности или подписи FROZEN.</text></g></svg>
