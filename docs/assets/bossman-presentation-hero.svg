<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="autoPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font: 800 32px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; letter-spacing: 0.5px; }
      .subtitle { font: 500 15px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .badge { font: 700 12px 'Cascadia Code', Consolas, monospace; fill: #10b981; }
      .panel-title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #e2e8f0; }
      .mono { font: 500 12.5px 'Cascadia Code', Consolas, monospace; fill: #cbd5e1; }
      .mono-green { font: 600 12.5px 'Cascadia Code', Consolas, monospace; fill: #34d399; }
      .mono-amber { font: 700 12.5px 'Cascadia Code', Consolas, monospace; fill: #fbbf24; }
      .mono-cyan { font: 600 12.5px 'Cascadia Code', Consolas, monospace; fill: #38bdf8; }
      .pill-txt { font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes flow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .pulse-dot { animation: pulse 1.8s infinite ease-in-out; }
      .flow-line { stroke-dasharray: 8 6; animation: flow 1.6s linear infinite; }
    </style>
  </defs>

