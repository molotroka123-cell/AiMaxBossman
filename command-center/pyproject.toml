[project]
name = "bossman-command-center"
version = "0.1.0"
description = "BOSSMAN AI Command Center — управление моделями, агентами, задачами и расписаниями"
requires-python = ">=3.11"
dependencies = [
    "bossman-shared==0.1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # [socks]: рантайм читает ALL_PROXY/HTTPS_PROXY из окружения для удалённых
    # адресов, а socks5-прокси httpx умеет только с socksio — без него он падал
    # ImportError'ом прямо в конструкторе клиента, то есть на здоровой системе
    # владелец получал пятисотку вместо ответа.
    "httpx[socks]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "psutil>=5.9",
    "cryptography>=50.0.1",
    "pyyaml>=6.0",
    # Native Image Studio editing is a product capability, not a provider extra.
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Optional local upstream engines; weights are supplied by the owner, never at boot.
documents = ["docling-slim[convert-core,format-pdf,format-office]==2.127.0"]
speech = ["faster-whisper==1.2.1"]
semantic-memory = ["qdrant-client==1.15.1"]
# Зависимости приложений, которые архив везёт внутри bcc/_apps: у них свои
# pyproject.toml, но их никто не устанавливает. numpy до сих пор попадал в
# runtime только транзитивно через docling; ai-webcam-vision без него умирал
# сразу после «Запустить» (BL-067).
apps = ["numpy>=1.26"]
# The owner installation ships the existing integrations. Individual extras
# remain available for small server-only/development installations.
runtime = ["bossman-command-center[browser,mcp,openclaw,video-interchange,documents,speech,semantic-memory,apps]==0.1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "greenlet>=3.0", "pytest-timeout>=2.2", "pytest-cov>=5.0", "setuptools>=68"]
# Браузерные тесты. Отдельной группой, а не в dev: Playwright тянет за собой
# браузер, и требовать его от всех, кто просто хочет прогнать юнит-тесты,
# незачем. Без этой группы браузерные тесты честно SKIP'аются, а не падают.
browser = ["playwright>=1.47"]
# MCP-рантайм (bcc/v2/mcp_runtime.py). Импорт ленивый: без пакета сервер
# стартует, а MCP-эндпоинты честно отвечают «недоступно».
mcp = ["mcp>=2.1,<3"]
# Мост OpenClaw (bcc/v2/openclaw_bridge.py). Пакет приходил ТРАНЗИТИВНО,
# из `uvicorn[standard]`, и поэтому мост работал — но по случайности чужого
# extra, а не по нашему объявлению. uvicorn умеет и wsproto; в день, когда
# его `standard` сменит реализацию, мост станет недоступен на установке,
# которая ничем не менялась. Объявляем прямо: возможность наша — и
# зависимость наша.
openclaw = ["websockets>=13"]
# Optional local interchange; no model runtime is installed into the server.
video-interchange = ["opentimelineio>=0.18,<0.19"]

[project.scripts]
bcc = "bcc.app:main"
bcc-desktop = "bcc.desktop:main"
bcc-open = "bcc.desktop:main"
bossman-telegram = "bcc.telegram_companion.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bcc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
