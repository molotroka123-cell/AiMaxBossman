[project]
name = "bossman-command-center"
version = "0.1.0"
description = "BOSSMAN AI Command Center — управление моделями, агентами, задачами и расписаниями"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "psutil>=5.9",
    "cryptography>=42.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "greenlet>=3.0", "pytest-timeout>=2.2"]
# MCP-рантайм (bcc/v2/mcp_runtime.py). Импорт ленивый: без пакета сервер
# стартует, а MCP-эндпоинты честно отвечают «недоступно».
mcp = ["mcp>=2.1,<3"]

[project.scripts]
bcc = "bcc.app:main"
bcc-desktop = "bcc.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bcc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
