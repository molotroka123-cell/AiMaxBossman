<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0c10">
<title>BOSSMAN Command Center</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<!-- Слой дизайн-системы: подключается после style.css и ничего в нём не
     переписывает. Старые страницы остаются как были, новая главная и лаунчер
     берут токены отсюда. -->
<link rel="stylesheet" href="theme.css">
</head>
<body>

<!-- ============ Экран входа ============ -->
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="login-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M13.6 2 4.5 13.4h5.2L9 22l9.5-11.7h-5.4L13.6 2z" fill="currentColor"/></svg>
    </div>
    <h1 class="login-title">BOSSMAN <span>Command Center</span></h1>
    <p class="login-sub">Локальный control plane. Доступ по токену.</p>
    <label class="field">
      <span class="field-label">Токен доступа</span>
      <input id="login-token" type="password" class="input mono" placeholder="вставьте токен" autocomplete="off" spellcheck="false">
    </label>
    <p class="login-hint">Токен напечатан в консоли сервера при старте.</p>
    <div id="login-error" class="login-error" hidden></div>
    <button type="submit" class="btn btn-primary btn-block" id="login-submit">Войти</button>
  </form>
</div>

<!-- ============ Оболочка приложения ============ -->
<div id="shell" class="shell" hidden>

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M13.6 2 4.5 13.4h5.2L9 22l9.5-11.7h-5.4L13.6 2z" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">
        <b>BOSSMAN</b>
      </span>
    </div>
    <nav id="nav" class="nav" aria-label="Основная навигация"></nav>
    <div class="sidebar-foot">
      <button class="kbd-hint" id="palette-open" type="button">
        <span>Команды</span><kbd id="palette-kbd">Ctrl K</kbd>
      </button>
      <div class="conn" id="conn" title="Состояние соединения">
        <span class="dot dot-idle" id="conn-dot"></span>
        <span id="conn-text">соединение…</span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="mobile-menu" type="button" aria-label="Меню">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
      <h1 class="page-title" id="page-title">Главная</h1>
      <div class="topbar-spacer"></div>
      <div class="topbar-stats" id="topbar-stats"></div>
      <button class="icon-btn" id="think-open" type="button" aria-label="Процесс работы" title="Процесс работы (Ctrl+.)" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg>
      </button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Сменить тему" title="Сменить тему"></button>
      <button class="icon-btn" id="refresh-btn" type="button" aria-label="Обновить" title="Обновить">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      </button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <nav class="mobilenav" id="mobilenav" aria-label="Навигация"></nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div id="modal-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>

<!-- ============ Командная палитра ============ -->
<div id="palette" class="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Командная палитра">
    <div class="palette-head">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
      <input id="palette-input" class="palette-input" placeholder="Команда или страница…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div id="palette-list" class="palette-list"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
