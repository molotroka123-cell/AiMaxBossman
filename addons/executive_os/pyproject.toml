[project]
name = "bossman-executive-os"
version = "0.1.0"
description = "Additive local mission control for Bossman through supported ports"
requires-python = ">=3.11"
dependencies = ["bossman-shared", "bossman-core", "bossman-command-center"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bossman_os", "bossman_os.extensions"]

[tool.setuptools.package-data]
bossman_os = ["extensions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
