# LiteLLM — единый OpenAI-совместимый шлюз.
# Агенты знают только алиасы (bossman-fast и т.д.), никогда имена файлов и адреса.
# Смена модели = правка одной строки здесь + в llama-swap/config.yaml.

model_list:
  # ---------- локальные (через llama-swap) ----------
  - model_name: bossman-fast
    litellm_params:
      model: openai/bossman-fast
      api_base: http://llama-swap:8080/v1
      api_key: local
  - model_name: bossman-smart
    litellm_params:
      model: openai/bossman-smart
      api_base: http://llama-swap:8080/v1
      api_key: local
  - model_name: bossman-coder
    litellm_params:
      model: openai/bossman-coder
      api_base: http://llama-swap:8080/v1
      api_key: local
  - model_name: bossman-writer
    litellm_params:
      model: openai/bossman-writer
      api_base: http://llama-swap:8080/v1
      api_key: local
  - model_name: bossman-uncensored          # личный чат; ключам агентов не выдаётся
    litellm_params:
      model: openai/bossman-uncensored
      api_base: http://llama-swap:8080/v1
      api_key: local
  - model_name: bossman-embed
    litellm_params:
      model: openai/bossman-embed
      api_base: http://llama-swap:8080/v1
      api_key: local

  # ---------- облако ----------
  - model_name: claude-heavy                 # сложный кодинг, важные тексты
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-max
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: cloud-fallback               # дешёвый запасной вариант, когда локальная модель недоступна
    litellm_params:
      model: openrouter/openai/gpt-oss-120b
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  # Если локальная модель не отвечает (грузится / упала) — уходим в облако.
  # Для ключей без доступа к облачным алиасам fallback не сработает — это осознанно (приватные данные).
  fallbacks:
    - bossman-fast: ["cloud-fallback"]
    - bossman-smart: ["claude-heavy"]
    - bossman-coder: ["claude-heavy"]

litellm_settings:
  drop_params: true          # не падать на параметрах, которые модель не знает
  request_timeout: 600       # большие модели грузятся до минуты-двух
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
